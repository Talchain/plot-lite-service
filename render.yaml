# render.yaml — Render Blueprint for auto-deploy from GitHub
# After connecting repo in Render dashboard, use "Create from Blueprint" to provision both services
# NOTE: Render dashboard config is authoritative; blueprint may differ by environment.

services:
  # Staging: auto-deploys on every push to staging
  - type: web
    name: plot-lite-service-staging
    env: node
    plan: starter
    region: oregon
    branch: staging
    autoDeploy: true
    healthCheckPath: /v1/health
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCM_LITE_ENABLE
        value: "0"
      - key: SCM_LITE_K
        value: "500"
      - key: SCM_LITE_BELIEF_DEFAULT
        value: "0.5"
      - key: AUTH_ENABLED
        value: "1"
      - key: RATE_LIMIT_ENABLED
        value: "1"
      - key: RATE_LIMIT_RPM
        value: "60"
      - key: BUILD_ID
        fromEnvVar: RENDER_GIT_COMMIT
      - key: ENABLE_VALIDATE_PATCH
        value: "1"
      - key: CORS_ORIGINS
        value: "https://staging--olumi.netlify.app,https://olumi.netlify.app,http://localhost:5173"
      # Add AUTH_TOKEN as secret in Render dashboard after connecting repo

  # Production: manual deploy only (safer)
  - type: web
    name: plot-lite-service
    env: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: false
    healthCheckPath: /v1/health
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCM_LITE_ENABLE
        value: "0"
      - key: SCM_LITE_K
        value: "500"
      - key: SCM_LITE_BELIEF_DEFAULT
        value: "0.5"
      - key: AUTH_ENABLED
        value: "1"
      - key: RATE_LIMIT_ENABLED
        value: "1"
      - key: RATE_LIMIT_RPM
        value: "60"
      - key: BUILD_ID
        fromEnvVar: RENDER_GIT_COMMIT
      - key: CORS_ORIGINS
        value: "https://olumi.netlify.app,https://staging--olumi.netlify.app"
      # Add AUTH_TOKEN as secret in Render dashboard after connecting repo

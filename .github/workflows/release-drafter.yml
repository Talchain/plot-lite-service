name: Release Drafter
on:
  # pull_request trigger removed 5 Oct 2026 (CI OPTIMISER): a release draft is
  # cut from main, and on PRs it only spent a runner per PR event.
  push:
    branches: [ main ]
jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

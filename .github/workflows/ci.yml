name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for stale .js files in src/
        run: bash scripts/check-no-stale-js.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint (ESLint)
        # Single gate, single threshold: CI runs the SAME npm script developers
        # run locally (--max-warnings 0). Never inline an eslint command here —
        # a second command with its own flags is how the 97-vs-0 split-brain
        # happened (ROADMAP 2.465).
        run: npm run lint
      - name: Validate contracts
        run: npm run validate:contracts
      - name: Numeric-egress coercion gate
        # Fails when a contract-declared numeric response field is assigned a
        # literal fallback (`?? 0`, `?? 0.5`) instead of being validated through
        # src/routes/v2/numeric-egress-guards.ts and OMITTED when the producer
        # did not measure it. Its own scope is derived from contracts/ and the
        # route import graph, and it fails loud rather than passing vacuously if
        # either derivation comes back empty.
        run: npm run gate:numeric-egress
      - run: npm run build
      - name: Run tests
        run: RATE_LIMIT_ENABLED=0 npm test
        env:
          CI: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .tmp/
            coverage/

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: 'npm'

      - name: Deps gate (npm ci + typecheck)
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Trace viewer smoke (help)
        run: node tools/trace-view.cjs --help

      - name: Build
        run: npm run build

      - name: P0 Gate - Ban Math.random() in trust signals
        run: node tools/ban-math-random.mjs

      - name: Check for stale JS files
        run: |
          # Only fail if .js exists alongside .ts sibling (not standalone .js files)
          stale_found=0
          for jsfile in $(find src -name "*.js" -not -path "*/scripts/*" 2>/dev/null || true); do
            tsfile="${jsfile%.js}.ts"
            if [ -f "$tsfile" ]; then
              echo "ERROR: Stale JS file found alongside TS: $jsfile (sibling: $tsfile)"
              stale_found=1
            fi
          done
          
          if [ $stale_found -eq 1 ]; then
            echo ""
            echo "Remove stale .js files or ensure they're in .gitignore"
            echo "These .js files should be generated by 'npm run build' into dist/, not committed."
            exit 1
          fi
          
          echo "✅ No stale JS files found alongside TS sources"

      - name: P1D-1 Gate - No .only in tests
        run: node tools/test-only-guard.mjs

      - name: P1D-1 Gate - Skip expiry check
        run: node tools/test-skip-expiry.mjs

      - name: Tools harness (soak/replay)
        run: npm run test:tools-harness
        env:
          FEATURE_STREAM: '1'
          STREAM_HEARTBEAT_SEC: '1'

      - name: Test + env gate (same shell)
        run: |
          set -e
          npm test
          node tools/test-env-gate.mjs
        env:
          P95_BUDGET_MS: '600'
          STRICT_LOADCHECK: '1'

      - name: P1D-1 Gate - Coverage floors (core paths)
        run: npm test -- --coverage --run
        env:
          P95_BUDGET_MS: '600'

      - name: P0 Gate - Determinism (strict mode)
        run: |
          node dist/main.js & echo $! > determinism-server.pid
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1:4311/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          node tools/determinism-gate.mjs
          kill $(cat determinism-server.pid)
        env:
          PORT: '4311'

      - name: P0 Gate - SSE Inflight Balance
        run: |
          node dist/main.js & echo $! > sse-server.pid
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1:4311/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          node tools/sse-inflight-gate.mjs
          kill $(cat sse-server.pid)
        env:
          PORT: '4311'
          TEST_ROUTES: '1'
          FEATURE_STREAM: '1'

      - name: P0 Gate - Self-Check Hash Stability
        run: |
          node dist/main.js & echo $! > self-check-server.pid
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1:4311/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          node tools/self-check-gate.mjs
          kill $(cat self-check-server.pid)
        env:
          PORT: '4311'
          TEST_ROUTES: '1'

      - name: Enforce load budget (strict)
        run: |
          node dist/main.js & echo $! > server.pid
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1:4311/ready >/dev/null; then break; fi
            sleep 0.25
          done
          node tools/loadcheck-wrap.cjs
          kill $(cat server.pid)
        env:
          TEST_BASE_URL: http://127.0.0.1:4311
          P95_BUDGET_MS: '600'
          STRICT_LOADCHECK: '1'

      - name: Ensure tests.json (non-blocking)
        run: node tools/ensure-tests-json.js
        continue-on-error: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/tests.json
            docs/collections/plot-lite.postman.json
            docs/contract-report.html
          if-no-files-found: warn

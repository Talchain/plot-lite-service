name: Tools Gates (B-G)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # 2 AM daily

jobs:
  gates:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      TOOLS_DIR: ${{ github.workspace }}/../olumi-tools
      CONTRACTS_DIR: ${{ github.workspace }}/../olumi-contracts
      ENGINE_DIR: ${{ github.workspace }}
      ENGINE_URL: ${{ secrets.ENGINE_URL || '' }}
    
    steps:
      - name: Checkout plot-lite-service
        uses: actions/checkout@v4
      
      - name: Setup Node.js 20.19.5
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
      
      - name: Setup pnpm 10.18.0
        uses: pnpm/action-setup@v4
        with:
          version: '10.18.0'
      
      - name: Checkout olumi-tools
        uses: actions/checkout@v4
        with:
          repository: olumi/olumi-tools
          path: ../olumi-tools
      
      - name: Checkout olumi-contracts
        uses: actions/checkout@v4
        with:
          repository: olumi/olumi-contracts
          path: ../olumi-contracts
      
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd ../olumi-tools && pnpm install --frozen-lockfile
      
      - name: Gate B - Schema Risk
        run: |
          node ../olumi-tools/packages/schema-compat/bin/schema-compat-cli.mjs \
            --baseline="../olumi-tools/packages/schema-compat/baselines/report.v1.schema.json" \
            --candidate="../olumi-contracts/schemas/report.v1.schema.json" \
            --openapi="../olumi-contracts/contracts/openapi/report.v1.fragment.json" \
            --md-out="reports/schema-compat/schema-diff.md" \
            --json-out="reports/schema-compat/risk.json"
      
      - name: Gate C - Determinism
        run: |
          node ../olumi-tools/packages/engine-detcheck/bin/detcheck.mjs \
            --strict --normalised --bma-runs=10 \
            --diff-out="out/diff.json" \
            --bma-log="reports/bma/bma_runs.jsonl"
      
      - name: Gate D - SLOs (auto-detect live or mocks)
        run: |
          # ENGINE_URL set by workflow or defaults to empty (triggers mock fallback)
          node ../olumi-tools/packages/slo-collect/bin/collect.mjs --samples=200

      - name: Gate E - Privacy
        run: |
          node ../olumi-tools/packages/privacy-verify/bin/verify.mjs

      - name: Gate F - Trust Chain
        run: |
          # Create minimal pack for testing
          mkdir -p out
          DATE=$(date +%Y%m%d)
          COMMIT=$(git rev-parse --short HEAD)
          echo "test pack" > out/test.txt
          cd out && zip -q -X engine_pack_${DATE}_${COMMIT}.zip test.txt && cd ..

          # Run trust chain
          node ../olumi-tools/packages/pack-lint/bin/lint.mjs
          node ../olumi-tools/packages/provenance/bin/stamp.mjs
          node ../olumi-tools/packages/pack-sign/bin/sign.mjs
          node ../olumi-tools/packages/trust-bundle/bin/bundle.mjs
          node ../olumi-tools/packages/trust-verify/bin/verify.mjs
          node ../olumi-tools/packages/trust-policy/bin/audit.mjs
          node ../olumi-tools/packages/evidence-merge/bin/merge.mjs

      - name: Gate G - Reproducibility
        run: |
          node ../olumi-tools/packages/repro-verify/bin/verify.mjs

      - name: Gate P - Pack Build
        run: |
          node tools/pack-build.mjs

      - name: Gate L - Coverage & Fuzz
        run: |
          cd ../olumi-tools && pnpm run coverage && pnpm --filter @olumi/fuzzers run test

      - name: Generate Status Reports
        run: |
          node scripts/gates-status.mjs > GATES_STATUS.md
          node scripts/nightly.mjs

      - name: Create Handoff Bundle
        run: |
          mkdir -p handoff
          DATE=$(date +%Y%m%d)
          zip -q -r handoff/handoff_${DATE}_v023.zip \
            reports/ out/ artifact/ GATES_STATUS.md \
            || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gates-artifacts-${{ matrix.os }}
          path: |
            reports/
            out/
            artifact/
            handoff/
            GATES_STATUS.md

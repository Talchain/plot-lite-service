name: Performance Probe
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: |
          TEST_ROUTES=1 AUTH_ENABLED=0 RATE_LIMIT_ENABLED=0 node dist/main.js &
          sleep 5
      - name: Run perf probe
        run: |
          if [ -f tools/perf-probe-p1.js ]; then
            node tools/perf-probe-p1.js > perf-results.json
            cat perf-results.json
          else
            echo "Perf probe not found, skipping"
            echo '{"p95":0}' > perf-results.json
          fi
      - name: Check budget
        run: |
          P95=$(node -p "JSON.parse(require('fs').readFileSync('perf-results.json','utf8')).p95 || 0")
          echo "p95_ms=$P95"
          if [ $(echo "$P95 > 600" | bc -l 2>/dev/null || echo 0) -eq 1 ]; then
            echo "❌ Performance budget exceeded: p95=${P95}ms > 600ms"
            exit 1
          fi
          echo "✅ Performance within budget"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf-results.json

name: Engine Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Install pnpm first so setup-node cache=pnpm can detect it
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # Consistent runtime for scripts
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      # jq used only on Linux; skip elsewhere
      - name: Ensure jq (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq

      # Detect if PR is maintenance-only (ignore heavy gates for these)
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            non_maintenance:
              - 'src/**'
              - 'tests/**'
              - 'tools/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
            maintenance:
              - '.gitignore'
              - '.ci-run*.txt'
              - '.baseline-summary*.json'

      - name: Short-circuit for maintenance-only PRs
        if: steps.changes.outputs.non_maintenance == 'false' && steps.changes.outputs.maintenance == 'true'
        run: echo "Maintenance-only PR; skipping gates." && exit 0

      - name: Make gates executable
        run: chmod +x RUN_NIGHTLY_GATES.sh || true

      - name: Run Engine Gates
        env:
          ENGINE_DIR: ${{ github.workspace }}
          TOOLS_DIR: ${{ github.workspace }}
          CONTRACTS_DIR: ${{ github.workspace }}
        run: bash -eo pipefail RUN_NIGHTLY_GATES.sh

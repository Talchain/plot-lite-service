name: Engine Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Detect if PR is maintenance-only (skip heavy gates on these)
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            non_maintenance:
              - 'src/**'
              - 'tests/**'
              - 'tools/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            maintenance:
              - '.gitignore'
              - '.github/workflows/**'
              - '.ci-run*.txt'
              - '.baseline-summary*.json'

      - name: Short-circuit for maintenance-only PRs
        if: steps.changes.outputs.non_maintenance == 'false' && steps.changes.outputs.maintenance == 'true'
        run: echo "Maintenance-only PR; skipping gates." && exit 0

      - name: Checkout (non-Windows)
        if: runner.os != 'Windows'
        uses: actions/checkout@v4

      - name: Checkout (Windows, sparse)
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
            package-lock.json
            tsconfig.json
            tsconfig.tools.json
            src
            tools
            tools/gates
            RUN_NIGHTLY_GATES.sh
          sparse-checkout-cone-mode: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Ensure jq (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Make gates executable
        run: chmod +x RUN_NIGHTLY_GATES.sh || true

      - name: Run Engine Gates
        env:
          ENGINE_DIR: ${{ github.workspace }}
          TOOLS_DIR: ${{ github.workspace }}
          CONTRACTS_DIR: ${{ github.workspace }}
        run: bash -eo pipefail RUN_NIGHTLY_GATES.sh

name: dependency-audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # NOTE (8 Aug 2026, ROADMAP 2.920): a weekly `schedule:` cron lived here but had
  # structurally NEVER fired - GitHub runs `schedule:` only from the DEFAULT branch
  # (main) and this file exists only on `staging`. Removed rather than left claiming
  # a guarantee it cannot deliver; between-PR advisory drift is covered by the
  # session ritual (scheduler-liveness + audit reads, ROADMAP 2.385). Re-add a cron
  # only when this file reaches the default branch (rides row 2.904).
permissions:
  contents: read
  packages: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Runs BEFORE the audit on purpose. `npm audit` only notices a broken override once an
      # advisory happens to exist for whatever got resolved instead; this gate notices the moment
      # an override stops applying, or is pinned to a shape that cannot absorb a patched release.
      # `--self-test` runs its own discriminating controls first, so a gate that has silently
      # stopped discriminating fails here rather than passing quietly.
      - name: Assert security overrides are in effect
        run: node tools/ci/overrides-effective-gate.mjs --self-test && node tools/ci/overrides-effective-gate.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

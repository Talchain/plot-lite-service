<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLoT SDK Browser Example</title>
  <style>
    body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    pre { background: #f5f5f5; padding: 15px; border-radius: 4px; overflow-x: auto; }
    .status { margin: 20px 0; padding: 10px; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
  </style>
</head>
<body>
  <h1>PLoT SDK Browser Example</h1>
  <p>Run → Compare → Inspect happy path with 429 retry handling</p>
  
  <div>
    <button onclick="runFlow()">Run Full Flow</button>
    <button onclick="clearOutput()">Clear</button>
  </div>
  
  <div id="output"></div>

  <script type="module">
    import { run, compare, inspect } from 'https://esm.sh/@olumi/plot-sdk@0.4.0';

    const output = document.getElementById('output');

    function log(message, type = 'info') {
      const div = document.createElement('div');
      div.className = `status ${type}`;
      div.textContent = message;
      output.appendChild(div);
    }

    function logJSON(label, data) {
      const pre = document.createElement('pre');
      pre.textContent = `${label}:\n${JSON.stringify(data, null, 2)}`;
      output.appendChild(pre);
    }

    async function retryWith429(fn, maxRetries = 3) {
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          return await fn();
        } catch (err) {
          if (err.message.includes('429') && attempt < maxRetries) {
            const retryAfter = 1; // seconds
            log(`⏳ Rate limited, retrying in ${retryAfter}s (attempt ${attempt}/${maxRetries})`, 'info');
            await new Promise(r => setTimeout(r, retryAfter * 1000));
          } else {
            throw err;
          }
        }
      }
    }

    window.runFlow = async function() {
      output.innerHTML = '';
      log('🚀 Starting flow...', 'info');

      const graph = {
        nodes: [
          { id: 'Price', label: 'Price' },
          { id: 'Demand', label: 'Demand' },
          { id: 'Revenue', label: 'Revenue' }
        ],
        edges: [
          { from: 'Price', to: 'Demand', weight: -0.5 },
          { from: 'Demand', to: 'Revenue', weight: 0.8 }
        ]
      };

      try {
        // Step 1: Run
        log('1️⃣ Running inference...', 'info');
        const runResult = await retryWith429(() => 
          run({ graph, seed: 4242 })
        );
        logJSON('Run Result', {
          response_hash: runResult.result.response_hash,
          summary: runResult.result.summary
        });

        // Step 2: Compare
        log('2️⃣ Comparing scenarios...', 'info');
        const compareResult = await retryWith429(() =>
          compare({
            graph,
            scenarios: [
              { label: 'Base', interventions: [] },
              { label: 'Lower Price', interventions: [{ node_id: 'Price', set_to: 0.3 }] }
            ],
            seed: 4242
          })
        );
        logJSON('Compare Result', {
          scenarios: compareResult.scenarios.map(s => ({
            label: s.label,
            outcome_p50: s.outcome.p50
          }))
        });

        // Step 3: Inspect
        log('3️⃣ Inspecting graph...', 'info');
        const inspectResult = await retryWith429(() =>
          inspect({ graph, seed: 4242 })
        );
        logJSON('Inspect Result', {
          linearity: inspectResult.linearity,
          identifiability: inspectResult.identifiability
        });

        log('✅ Flow completed successfully!', 'success');
        
      } catch (err) {
        log(`❌ Error: ${err.message}`, 'error');
        console.error(err);
      }
    };

    window.clearOutput = function() {
      output.innerHTML = '';
    };

    // Log SDK info
    log('SDK loaded from ESM CDN', 'info');
    log('User-Agent: Browser (x-olumi-sdk header only)', 'info');
  </script>
</body>
</html>

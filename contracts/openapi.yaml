  /v1/compare:
    post:
      summary: Compare graph options
      description: Compare 2-5 graph options with deterministic p10/p50/p90 + deltas
      operationId: compareOptions
      tags: [v1, inference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graphs]
              properties:
                seed:
                  type: integer
                  example: 4242
                graphs:
                  type: array
                  minItems: 2
                  maxItems: 5
                  items:
                    type: object
                    required: [graph, label]
                    properties:
                      graph:
                        $ref: '#/components/schemas/graph'
                      label:
                        type: string
            example:
              seed: 4242
              graphs:
                - graph:
                    nodes: [{id: "A", label: "Option A"}]
                    edges: []
                  label: "A"
                - graph:
                    nodes: [{id: "B", label: "Option B"}]
                    edges: []
                  label: "B"
      responses:
        '200':
          description: Comparison results
          content:
            application/json:
              schema:
                type: object
                required: [schema, baseline, options, seed]
                properties:
                  schema:
                    type: string
                    example: "compare.v1"
                  baseline:
                    type: string
                    description: 'Label of the baseline option'
                  options:
                    type: array
                    items:
                      type: object
                      required: [label, p10, p50, p90, top_drivers, delta]
                      properties:
                        label:
                          type: string
                        p10:
                          type: number
                        p50:
                          type: number
                        p90:
                          type: number
                        top_drivers:
                          type: array
                          items:
                            type: object
                            required: [node_id, node_label, sign, contribution]
                            properties:
                              node_id:
                                type: string
                              node_label:
                                type: string
                              sign:
                                type: string
                                enum: ['+', '-']
                              contribution:
                                type: integer
                        delta:
                          type: object
                          properties:
                            p10: { type: number }
                            p50: { type: number }
                            p90: { type: number }
                        change_attribution:
                          $ref: '#/components/schemas/changeAttribution'
                  seed:
                    type: integer
                  model_card_subset:
                    type: object
              example:
                schema: "compare.v1"
                baseline: "A"
                options:
                  - label: "A"
                    p10: 0.44
                    p50: 1.12
                    p90: 2.12
                    top_drivers:
                      - node_id: "marketing"
                        node_label: "Marketing Spend"
                        sign: "+"
                        contribution: 55
                    delta: {p10: 0, p50: 0, p90: 0}
                  - label: "B"
                    p10: 0.50
                    p50: 1.25
                    p90: 2.30
                    top_drivers:
                      - node_id: "marketing"
                        node_label: "Marketing Spend"
                        sign: "+"
                        contribution: 60
                    delta: {p10: 0.06, p50: 0.13, p90: 0.18}
                    change_attribution:
                      outcome_delta: 0.13
                      primary_drivers:
                        - change_type: "edge_weight_changed"
                          description: "Changed Marketing Spend → Revenue weight (0.70 → 0.90)"
                          contribution_to_delta: 0.10
                          contribution_pct: 77
                          before_value: 0.70
                          after_value: 0.90
                          affected_nodes:
                            - id: "marketing"
                              label: "Marketing Spend"
                            - id: "revenue"
                              label: "Revenue"
                      summary: "77% of increase from changed Marketing Spend → Revenue weight (0.70 → 0.90)"
                seed: 4242
        '400':
          description: Bad input
          content:
            application/json:
              examples:
                invalid_graphs:
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "graphs array must contain 2-5 items"

  /v1/diff:
    post:
      summary: Compute structural diff between two graphs
      description: |
        Computes a structural diff between two decision graphs for comparison views.
      operationId: diffGraphs
      tags: [v1, inference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [before, after]
              properties:
                before:
                  $ref: '#/components/schemas/graph'
                after:
                  $ref: '#/components/schemas/graph'
            example:
              before:
                nodes: [{ id: "A", label: "Before" }]
                edges: []
              after:
                nodes:
                  - { id: "A", label: "Before" }
                  - { id: "B", label: "After" }
                edges:
                  - { from: "A", to: "B" }
      responses:
        '200':
          description: Graph diff
          content:
            application/json:
              schema:
                type: object
                required: [schema, graphs, diff]
                properties:
                  schema:
                    type: string
                    enum: [diff.v1]
                  graphs:
                    type: object
                    properties:
                      before:
                        type: object
                        properties:
                          nodes: { type: integer }
                          edges: { type: integer }
                      after:
                        type: object
                        properties:
                          nodes: { type: integer }
                          edges: { type: integer }
                  diff:
                    type: object
                    properties:
                      nodes_added:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      nodes_removed:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      nodes_modified:
                        type: array
                        items:
                          type: object
                          properties:
                            node:
                              type: object
                              additionalProperties: true
                            changes:
                              type: array
                              items:
                                type: object
                                properties:
                                  field: { type: string }
                                  old_value: {}
                                  new_value: {}
                      edges_added:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      edges_removed:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      edges_modified:
                        type: array
                        items:
                          type: object
                          properties:
                            edge:
                              type: object
                              additionalProperties: true
                            changes:
                              type: array
                              items:
                                type: object
                                properties:
                                  field: { type: string }
                                  old_value: {}
                                  new_value: {}
                      summary:
                        type: object
                        properties:
                          total_changes: { type: integer }
                          significant_changes: { type: integer }
              example:
                schema: diff.v1
                graphs:
                  before: { nodes: 1, edges: 0 }
                  after: { nodes: 2, edges: 1 }
                diff:
                  nodes_added:
                    - { id: "B", label: "After" }
                  nodes_removed: []
                  nodes_modified: []
                  edges_added:
                    - { from: "A", to: "B" }
                  edges_removed: []
                  edges_modified: []
                  summary:
                    total_changes: 2
                    significant_changes: 0
        '400':
          description: Bad input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                bad_input:
                  value:
                    schema: error.v1
                    code: BAD_INPUT
                    message: 'Missing required field: before'


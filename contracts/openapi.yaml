  /v1/score:
    post:
      summary: Score options with utilities
      description: |
        Rank options under uncertainty using utility functions.
        Returns percentile-based utility scores and ranking.
      operationId: scoreOptions
      tags: [v1, inference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph, utilities]
              properties:
                graph:
                  type: object
                  required: [nodes, edges]
                  properties:
                    nodes:
                      type: array
                      items:
                        type: object
                        required: [id]
                        properties:
                          id:
                            type: string
                          label:
                            type: string
                    edges:
                      type: array
                      items:
                        type: object
                        properties:
                          from: { type: string }
                          to: { type: string }
                          label: { type: string }
                          weight: { type: number }
                seed:
                  type: integer
                  example: 4242
                utilities:
                  type: object
                  required: [type, weights]
                  properties:
                    type:
                      type: string
                      enum: [linear]
                    weights:
                      type: object
                      additionalProperties:
                        type: number
                      example: {"A": 1.0, "B": 0.5}
                    risk:
                      type: object
                      properties:
                        attitude:
                          type: string
                          enum: [averse, neutral, seeking]
                          default: neutral
            example:
              graph:
                nodes:
                  - {id: "A", label: "Option A"}
                  - {id: "B", label: "Option B"}
                edges: []
              seed: 4242
              utilities:
                type: "linear"
                weights: {"A": 1.0, "B": 0.5}
                risk: {attitude: "neutral"}
      responses:
        '200':
          description: Scoring results
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema:
                    type: string
                    example: "score.v1"
                  result:
                    type: object
                    properties:
                      options:
                        type: array
                        items:
                          type: object
                          properties:
                            node_id:
                              type: string
                            label:
                              type: string
                            utility:
                              type: object
                              properties:
                                p10:
                                  type: number
                                p50:
                                  type: number
                                p90:
                                  type: number
                                expected:
                                  type: number
                      ranking:
                        type: array
                        items:
                          type: string
                  top_drivers:
                    type: array
                    items:
                      type: object
                      properties:
                        node_id: { type: string }
                        contribution: { type: number }
                        sign: { type: string, enum: ['+','-'] }
                  meta:
                    type: object
              example:
                schema: "score.v1"
                result:
                  options:
                    - node_id: "A"
                      label: "Option A"
                      utility: {p10: 0.524, p50: 0.924, p90: 1.324, expected: 0.924}
                  ranking: ["A", "B"]
                top_drivers:
                  - {node_id: "A", contribution: 100, sign: "+"}
                meta: {seed: 4242, inference_mode: "model_based"}
        '400':
          description: Bad input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      message:
                        type: string
              examples:
                invalid_weights:
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "Invalid node_ids in weights: Z"

  /v1/intervene:
    post:
      summary: Causal interventions (do-operator)
      description: |
        Perform causal interventions and estimate counterfactual effects.
        Returns baseline, counterfactual, and delta with identifiability check.
      operationId: intervene
      tags: [v1, inference]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional key to replay the exact prior response within a TTL (scoped per principal)
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph]
              properties:
                graph:
                  type: object
                  required: [nodes, edges]
                  properties:
                    nodes:
                      type: array
                      items:
                        type: object
                        required: [id]
                        properties:
                          id:
                            type: string
                          label:
                            type: string
                    edges:
                      type: array
                      items:
                        type: object
                        properties:
                          from: { type: string }
                          to: { type: string }
                          label: { type: string }
                          weight: { type: number }
                seed:
                  type: integer
                  example: 4242
                actions:
                  type: array
                  description: Causal interventions via do-operator
                  items:
                    type: object
                    required: [node_id, value]
                    properties:
                      node_id:
                        type: string
                      value:
                        type: number
                flags:
                  type: object
                  properties:
                    scm_lite:
                      type: integer
                      enum: [0, 1]
            example:
              graph:
                nodes:
                  - {id: "X", label: "Cause"}
                  - {id: "Y", label: "Effect"}
                edges:
                  - {from: "X", to: "Y", weight: 0.5}
              seed: 4242
              actions:
                - {node_id: "X", value: 0.8}
              flags: {scm_lite: 1}
      responses:
        '200':
          description: Intervention results
          headers:
            Idempotent-Replayed:
              description: '1 if response is a replay from cache; 0 if computed fresh (when Idempotency-Key provided)'
              schema: { type: string, enum: ['0','1'] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema:
                    type: string
                    example: "intervene.v1"
                  baseline:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          p10: {type: number}
                          p50: {type: number}
                          p90: {type: number}
                  counterfactual:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          p10: {type: number}
                          p50: {type: number}
                          p90: {type: number}
                  delta:
                    type: object
                    properties:
                      p10: {type: number}
                      p50: {type: number}
                      p90: {type: number}
                  explain:
                    type: object
                    properties:
                      provenance:
                        type: string
                        example: "do-operator"
                      top_drivers:
                        type: array
                        items:
                          type: object
                          properties:
                            node_id: {type: string}
                            contribution: {type: number}
                            sign: {type: string, enum: ["+", "-"]}
                  model_card:
                    type: object
                    properties:
                      actions_hash: {type: string}
                      seed: {type: integer}
                      flags_on: {type: array, items: {type: string}}
                  response_hash:
                    type: string
              example:
                schema: "intervene.v1"
                baseline:
                  summary: {p10: 0.819, p50: 0.924, p90: 1.109}
                counterfactual:
                  summary: {p10: 0.915, p50: 1.044, p90: 1.253}
                delta: {p10: 0.096, p50: 0.120, p90: 0.144}
                explain:
                  provenance: "do-operator"
                  top_drivers:
                    - {node_id: "X", contribution: 80, sign: "+"}
                model_card:
                  actions_hash: "a1b2c3d4e5f6g7h8"
                  seed: 4242
                  flags_on: ["scm_lite"]
                response_hash: "1234567890abcdef"
        '400':
          description: Bad input or not identifiable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      message:
                        type: string
              examples:
                bad_input:
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "Invalid node_ids in actions: Z"
                missing_actions:
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "actions array required with at least one intervention"
        '409':
          description: Idempotency key reused with a different request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                mismatch:
                  value:
                    schema: error.v1
                    code: IDEMPOTENCY_MISMATCH
                    message: Idempotency-Key was reused with a different request body; use a new key.

  /v1/evidence:
    post:
      summary: Evidence & Priors
      description: |
        Apply reference-class priors to influence beliefs.
        Returns adjusted inference with baseline comparison.
        Note: v1 uses simple weighted average; full Bayesian update in future versions.
      operationId: evidence
      tags: [v1, inference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph, priors]
              properties:
                graph:
                  type: object
                  required: [nodes, edges]
                  properties:
                    nodes:
                      type: array
                      items:
                        type: object
                        required: [id]
                        properties:
                          id:
                            type: string
                          label:
                            type: string
                    edges:
                      type: array
                      items:
                        type: object
                        properties:
                          from: { type: string }
                          to: { type: string }
                          label: { type: string }
                          weight: { type: number }
                seed:
                  type: integer
                  example: 4242
                priors:
                  type: array
                  items:
                    type: object
                    required: [node_id, mean, variance]
                    properties:
                      node_id:
                        type: string
                      mean:
                        type: number
                      variance:
                        type: number
                      source:
                        type: string
                        example: "refclass:xyz"
            example:
              graph:
                nodes:
                  - {id: "A", label: "Node A"}
                edges: []
              seed: 4242
              priors:
                - {node_id: "A", mean: 0.8, variance: 0.05, source: "refclass:xyz"}
      responses:
        '200':
          description: Evidence results
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema:
                    type: string
                    example: "evidence.v1"
                  result:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          p10:
                            type: number
                          p50:
                            type: number
                          p90:
                            type: number
                      baseline:
                        type: object
                        properties:
                          p50:
                            type: number
                      adjustment:
                        type: object
                        properties:
                          delta:
                            type: number
                          direction:
                            type: string
                            enum: [increase, decrease, none]
                  top_drivers:
                    type: array
                    items:
                      type: object
                      properties:
                        node_id: { type: string }
                        contribution: { type: number }
                        sign: { type: string, enum: ['+','-'] }
                        source: { type: string }
                  meta:
                    type: object
                    properties:
                      seed:
                        type: integer
                      inference_mode:
                        type: string
                      prior_alpha:
                        type: number
                      limitations:
                        type: string
              example:
                schema: "evidence.v1"
                result:
                  summary: {p10: 0.524, p50: 0.724, p90: 0.924}
                  baseline: {p50: 0.624}
                  adjustment: {delta: 0.1, direction: "increase"}
                top_drivers:
                  - {node_id: "A", contribution: 80, sign: "+", source: "refclass:xyz"}
                meta: 
                  seed: 4242
                  inference_mode: "model_based"
                  prior_alpha: 0.3
                  limitations: "v1: Simple weighted average. Full Bayesian update in future versions."
        '400':
          description: Bad input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      message:
                        type: string
              examples:
                invalid_prior:
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "Invalid node_ids in priors: Z"

  /v1/sensitivity:
    post:
      summary: Sensitivity & Robustness Analysis
      description: |
        One-at-a-time (OAT) sensitivity analysis with tornado charts.
        Perturbs each target node by ±delta and measures effect on outcome.
      operationId: sensitivity
      tags: [v1, analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph]
              properties:
                graph:
                  $ref: '#/components/schemas/graph'
                seed:
                  type: integer
                  example: 4242
                method:
                  type: string
                  enum: [oat]
                  default: oat
                  description: Sensitivity method (one-at-a-time)
                delta:
                  type: number
                  minimum: 0
                  maximum: 1
                  exclusiveMinimum: true
                  default: 0.1
                  description: Proportional perturbation for OAT
                targets:
                  type: array
                  items:
                    type: string
                  description: Optional subset of node_ids to analyze (default all)
            example:
              graph:
                nodes:
                  - {id: "A", label: "Node A", value: 0.5}
                  - {id: "B", label: "Node B", value: 0.3}
                edges: []
              seed: 4242
              method: "oat"
              delta: 0.1
              targets: ["A", "B"]
      responses:
        '200':
          description: Sensitivity analysis results
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema:
                    type: string
                    example: "sensitivity.v1"
                  summary:
                    type: object
                    properties:
                      baseline:
                        type: object
                        properties:
                          p50:
                            type: number
                  drivers:
                    type: array
                    items:
                      type: object
                      properties:
                        node_id:
                          type: string
                        tornado:
                          type: object
                          properties:
                            low:
                              type: number
                              description: Effect when node decreased by delta
                            high:
                              type: number
                              description: Effect when node increased by delta
                        rank:
                          type: integer
                          description: Rank by total swing (1 = highest)
                  meta:
                    type: object
                    properties:
                      seed:
                        type: integer
                      method:
                        type: string
                      evaluations:
                        type: integer
                        description: Number of model evaluations (1 + 2*N)
              example:
                schema: "sensitivity.v1"
                summary:
                  baseline: {p50: 0.624}
                drivers:
                  - {node_id: "A", tornado: {low: -0.06, high: 0.08}, rank: 1}
                  - {node_id: "B", tornado: {low: -0.03, high: 0.04}, rank: 2}
                meta:
                  seed: 4242
                  method: "oat"
                  evaluations: 5
        '400':
          description: Bad input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                      message:
                        type: string
              examples:
                invalid_delta:
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "delta must be in (0, 1]"
                invalid_targets:
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "Invalid target node_ids: Z"

  /v1/run_batch:
    post:
      summary: Batch Runs
      description: |
        Execute multiple inference runs in a single request.
        Each item is processed deterministically with independent seeds.
      operationId: runBatch
      tags: [v1, batch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [graph]
                    properties:
                      graph:
                        $ref: '#/components/schemas/graph'
                      seed:
                        type: integer
                      k_samples:
                        type: integer
            example:
              items:
                - graph: {nodes: [{id: "A", label: "A"}], edges: []}
                  seed: 1
                - graph: {nodes: [{id: "B", label: "B"}], edges: []}
                  seed: 2
      responses:
        '200':
          description: Batch results
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema:
                    type: string
                    example: "run_batch.v1"
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        response_hash:
                          type: string
                        model_card:
                          type: object
              example:
                schema: "run_batch.v1"
                results:
                  - response_hash: "abc123"
                    model_card: {schema: "report.v1", seed: 1}
                  - response_hash: "def456"
                    model_card: {schema: "report.v1", seed: 2}
        '400':
          description: Bad input
          content:
            application/json:
              examples:
                too_many_items:
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "items array must contain 1-10 items"

  /v1/optimise:
    post:
      summary: Action Optimiser
      description: Select actions under budget to maximize utility with optional constraints
      operationId: optimise
      tags: [v1, optimisation]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional key to replay the exact prior response within a TTL (scoped per principal)
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph, budget, actions, objective]
              properties:
                graph: { $ref: '#/components/schemas/graph' }
                budget: { type: number, minimum: 0 }
                actions:
                  type: array
                  items:
                    type: object
                    required: [id, cost, do]
                    properties:
                      id: { type: string }
                      cost: { type: number, minimum: 0 }
                      do:
                        type: array
                        items:
                          type: object
                          properties:
                            node_id: { type: string }
                            set_to: { type: number }
                objective:
                  type: object
                  properties:
                    type: { type: string, enum: [utility_linear] }
                    weights: { type: object }
                seed: { type: integer }
                constraints:
                  type: object
                  description: Optional constraints on action selection
                  properties:
                    must:
                      type: array
                      items: { type: string }
                      description: Action IDs that must be selected
                    must_not:
                      type: array
                      items: { type: string }
                      description: Action IDs that must not be selected
                    max_changed_nodes:
                      type: integer
                      minimum: 0
                      description: Maximum number of nodes that can be affected
            example:
              graph:
                nodes:
                  - id: "revenue"
                    label: "Revenue"
                  - id: "cost"
                    label: "Cost"
                edges: []
              budget: 100
              actions:
                - id: "increase_marketing"
                  cost: 50
                  do:
                    - node_id: "revenue"
                      set_to: 1.2
                - id: "reduce_overhead"
                  cost: 30
                  do:
                    - node_id: "cost"
                      set_to: 0.8
              objective:
                type: "utility_linear"
                weights:
                  revenue: 1.0
                  cost: -0.5
              seed: 4242
      responses:
        '200':
          description: Optimisation results
          headers:
            Idempotent-Replayed:
              description: '1 if response is a replay from cache; 0 if computed fresh (when Idempotency-Key provided)'
              schema: { type: string, enum: ['0','1'] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema: { type: string, example: "optimise.v1" }
                  selected: { type: array, items: { type: string } }
                  utility: { type: object }
                  explanations:
                    type: array
                    items:
                      type: object
                      properties:
                        action_id: { type: string }
                        marginal_gain: { type: number }
                  meta: { type: object }
        '400':
          description: Bad input or infeasible constraints
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      schema: { type: string, example: "error.v1" }
                      code: { type: string, enum: [BAD_INPUT, INFEASIBLE] }
                      message: { type: string }
                      violations:
                        type: array
                        items:
                          type: object
                          properties:
                            type: { type: string }
                            message: { type: string }
                            constraint: { type: string }
                            node_id: { type: string }
                            required: { type: number }
                            available: { type: number }
                            reason: { type: string }
              examples:
                infeasible:
                  value:
                    schema: "error.v1"
                    code: "INFEASIBLE"
                    message: "Constraints cannot be satisfied"
        '409':
          description: Idempotency key reused with a different request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                mismatch:
                  value:
                    schema: error.v1
                    code: IDEMPOTENCY_MISMATCH
                    message: Idempotency-Key was reused with a different request body; use a new key.

  /v1/analysis/optimise:
    post:
      summary: Continuous Variable Optimisation
      description: |
        Optimise continuous decision variables using grid search with optional gradient refinement.
        Proxies to ISL /api/v1/analysis/optimise when ISL_ENABLE=1, otherwise uses local fallback.

        Different from /v1/optimise which handles discrete action selection under budget constraints.
        This endpoint optimises a single continuous decision variable within a search range.
      operationId: analysisOptimise
      tags: [v1, optimisation, analysis]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional key to replay the exact prior response within a TTL (scoped per principal)
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision_variable, search_range, objective_node, graph]
              properties:
                decision_variable:
                  type: string
                  description: Node ID of the decision variable to optimise
                search_range:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                  description: "[min, max] range to search for optimal value"
                objective_node:
                  type: string
                  description: Node ID of the objective to optimise
                objective_direction:
                  type: string
                  enum: [maximise, minimise]
                  default: maximise
                  description: Direction to optimise the objective
                constraints:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [node_id, operator, value]
                    properties:
                      node_id:
                        type: string
                        description: Node ID to constrain
                      operator:
                        type: string
                        enum: ["<=", ">=", "=="]
                        description: Constraint operator
                      value:
                        type: number
                        description: Constraint value
                graph:
                  $ref: '#/components/schemas/graph'
                grid_points:
                  type: integer
                  minimum: 2
                  maximum: 100
                  default: 20
                  description: Number of points for grid search
                refine:
                  type: boolean
                  default: false
                  description: Whether to apply gradient refinement after grid search
                confidence_level:
                  type: number
                  minimum: 0.5
                  maximum: 0.99
                  description: Confidence level for interval estimation (e.g., 0.95 for 95%)
            example:
              decision_variable: "price"
              search_range: [50, 150]
              objective_node: "revenue"
              objective_direction: "maximise"
              constraints:
                - node_id: "demand"
                  operator: ">="
                  value: 100
              graph:
                nodes:
                  - id: "price"
                    label: "Price"
                    type: "decision"
                  - id: "demand"
                    label: "Demand"
                    type: "outcome"
                  - id: "revenue"
                    label: "Revenue"
                    type: "outcome"
                edges:
                  - from: "price"
                    to: "demand"
                    weight: -0.5
                  - from: "price"
                    to: "revenue"
                    weight: 1.0
                  - from: "demand"
                    to: "revenue"
                    weight: 0.8
              grid_points: 20
              refine: true
              confidence_level: 0.95
      responses:
        '200':
          description: Optimisation results
          headers:
            Idempotent-Replayed:
              description: '1 if response is a replay from cache; 0 if computed fresh (when Idempotency-Key provided)'
              schema: { type: string, enum: ['0','1'] }
          content:
            application/json:
              schema:
                type: object
                required: [schema, result, provenance]
                properties:
                  schema:
                    type: string
                    example: "continuous_optimise.v1"
                  result:
                    type: object
                    required: [optimal_value, optimal_objective, confidence_interval, sensitivity, search_results, constraints_satisfied]
                    properties:
                      optimal_value:
                        type: number
                        description: Optimal value for the decision variable
                      optimal_objective:
                        type: number
                        description: Objective value at optimal point
                      confidence_interval:
                        type: array
                        items:
                          type: number
                        minItems: 2
                        maxItems: 2
                        description: "[low, high] confidence interval for optimal value"
                      sensitivity:
                        type: object
                        description: Sensitivity analysis at optimal point
                        properties:
                          gradient_at_optimum:
                            type: number
                            description: Gradient of objective at optimal point
                          second_derivative:
                            type: number
                            description: Second derivative (curvature) at optimal point
                          robustness:
                            type: string
                            enum: [high, medium, low]
                            description: Robustness classification based on curvature
                      search_results:
                        type: array
                        items:
                          type: object
                          properties:
                            value:
                              type: number
                              description: Decision variable value
                            objective:
                              type: number
                              description: Objective value at this point
                        description: Grid search results for visualisation
                      constraints_satisfied:
                        type: boolean
                        description: Whether all constraints are satisfied at optimal
                      active_constraints:
                        type: array
                        items:
                          type: string
                        description: List of constraint node IDs that are active at optimal
                      warnings:
                        type: array
                        items:
                          type: string
                        description: Any warnings about the optimisation
                  provenance:
                    type: string
                    enum: [isl, plot_fallback]
                    description: Whether result came from ISL or local fallback
                  model_card:
                    type: object
                    description: Model card with optimisation parameters
                    properties:
                      decision_variable:
                        type: string
                      objective_node:
                        type: string
                      objective_direction:
                        type: string
                      search_range:
                        type: array
                        items:
                          type: number
                      grid_points:
                        type: integer
                      refine:
                        type: boolean
                      nodes:
                        type: integer
                      edges:
                        type: integer
                  isl_error:
                    type: object
                    description: ISL error details if ISL call failed
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      retryable:
                        type: boolean
              example:
                schema: "continuous_optimise.v1"
                result:
                  optimal_value: 87.5
                  optimal_objective: 12500
                  confidence_interval: [82.5, 92.5]
                  sensitivity:
                    gradient_at_optimum: 0.02
                    second_derivative: -1.5
                    robustness: "medium"
                  search_results:
                    - value: 50
                      objective: 8000
                    - value: 75
                      objective: 11000
                    - value: 87.5
                      objective: 12500
                    - value: 100
                      objective: 12000
                    - value: 150
                      objective: 9000
                  constraints_satisfied: true
                  active_constraints: []
                  warnings: []
                provenance: "isl"
                model_card:
                  decision_variable: "price"
                  objective_node: "revenue"
                  objective_direction: "maximise"
                  search_range: [50, 150]
                  grid_points: 20
                  refine: true
                  nodes: 3
                  edges: 3
        '400':
          description: Bad input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                missing_field:
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "decision_variable required"
                invalid_range:
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "search_range must be [min, max] where min < max"
                node_not_found:
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "decision_variable 'price' not found in graph"
        '409':
          description: Idempotency key reused with a different request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                mismatch:
                  value:
                    schema: error.v1
                    code: IDEMPOTENCY_MISMATCH
                    message: Idempotency-Key was reused with a different request body; use a new key.

  /v1/preferences/fit:
    post:
      summary: Preferences & Calibration
      description: Fit utility weights from pairwise comparisons
      operationId: fitPreferences
      tags: [v1, calibration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairs, prior]
              properties:
                pairs:
                  type: array
                  items:
                    type: object
                    properties:
                      winner: { type: string }
                      loser: { type: string }
                      strength: { type: number }
                prior:
                  type: object
                  properties:
                    weights: { type: object }
      responses:
        '200':
          description: Fitted weights
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema: { type: string, example: "preferences.v1" }
                  weights: { type: object }
                  diagnostics: { type: object }
        '400':
          description: Bad input
          content:
            application/json:
              examples:
                invalid_pairs:
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "pairs array is required"

  /v1/run_bundle:
    post:
      summary: Run Bundle
      description: Evaluate multiple graph variations from a base graph with deltas
      operationId: runBundle
      tags: [v1, inference]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional key to replay the exact prior response within a TTL (scoped per principal)
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_graph, deltas]
              properties:
                base_graph: { $ref: '#/components/schemas/graph' }
                deltas:
                  type: array
                  items:
                    type: object
                    required: [label]
                    properties:
                      label: { type: string }
                      nodes:
                        type: array
                        items: { type: object }
                      edges:
                        type: array
                        items: { type: object }
                seed: { type: integer }
                detail_level:
                  type: string
                  enum: [quick, standard, deep]
                  default: standard
                  description: 'Controls inference compute budget (quick=K16, standard=K32, deep=K64)'
                baseline_value:
                  type: number
                  default: 100
                  description: 'Base value for outcome calculations'
                outcome_node:
                  type: string
                  description: 'Target node for inference (defaults to last node in first scenario)'
                include_ranking:
                  type: boolean
                  default: true
                  description: 'Include ranking summary and per-result ranks (default: true)'
                include_change_attribution:
                  type: boolean
                  default: false
                  description: 'Include change attribution in delta_from_baseline (default: false)'
                sort_by:
                  type: string
                  enum: [p10, p50, p90]
                  default: p50
                  description: 'Metric to use for ranking (default: p50)'
                ranking_mode:
                  type: string
                  enum: [simple, utility]
                  default: simple
                  description: |
                    Ranking mode for option comparison.
                    - simple: Rank by primary outcome percentile (default)
                    - utility: Multi-outcome ranking. Requires utility_function parameter with weights for each outcome node.
                utility_function:
                  type: object
                  description: 'Utility function for multi-outcome ranking. Required when ranking_mode=utility.'
                  properties:
                    weights:
                      type: object
                      additionalProperties: { type: number }
                      description: 'Weights per outcome node (must sum to 1.0)'
                    risk_attitude:
                      type: string
                      enum: [risk_averse, risk_neutral, risk_seeking]
                      default: risk_neutral
                      description: 'Risk attitude affects how uncertainty is valued'
                priors: { type: object }
                evidence:
                  type: array
                  items:
                    type: object
                    required: [node_id, source]
                    properties:
                      node_id: { type: string }
                      source: { type: string }
                      note: { type: string }
                      weight: { type: number, minimum: 0, maximum: 1 }
            examples:
              basic:
                value:
                  base_graph:
                    nodes: [{ id: "price", label: "Price" }]
                    edges: []
                  deltas:
                    - label: "Low Price"
                      nodes: [{ id: "price", value: 0.8 }]
                    - label: "High Price"
                      nodes: [{ id: "price", value: 1.2 }]
                  seed: 4242
                  detail_level: standard
      responses:
        '200':
          description: Bundle results
          headers:
            Idempotent-Replayed:
              description: '1 if response is a replay from cache; 0 if computed fresh (when Idempotency-Key provided)'
              schema: { type: string, enum: ['0','1'] }
          content:
            application/json:
              schema:
                type: object
                required: [schema, results, model_card, meta]
                properties:
                  schema: { type: string, example: "run_bundle.v1" }
                  results:
                    type: array
                    items:
                      type: object
                      required: [label, summary, model_card]
                      properties:
                        label: { type: string }
                        summary:
                          type: object
                          required: [p10, p50, p90]
                          properties:
                            p10: { type: number }
                            p50: { type: number }
                            p90: { type: number }
                        rank:
                          type: integer
                          description: 'Rank among all scenarios (1 = best). Present when include_ranking=true.'
                        success_probability:
                          type: number
                          description: 'Alias for summary[sort_by] for convenience.'
                        delta_from_baseline:
                          type: object
                          description: 'Difference from baseline scenario. Present when include_change_attribution=true.'
                          properties:
                            p10: { type: number, description: 'Difference in p10 from baseline' }
                            p50: { type: number, description: 'Difference in p50 from baseline' }
                            p90: { type: number, description: 'Difference in p90 from baseline' }
                            change_attribution:
                              type: object
                              description: 'Causal attribution explaining the difference'
                              properties:
                                summary: { type: string, description: 'Human-readable summary of primary drivers' }
                                primary_drivers:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      node_id: { type: string }
                                      node_label: { type: string }
                                      contribution_pct: { type: number }
                                      direction: { type: string, enum: [increase, decrease, unchanged] }
                        sensitivity_by_node:
                          type: array
                          description: 'Node-level sensitivity (top 5 nodes by contribution)'
                          items:
                            type: object
                            properties:
                              node_id: { type: string }
                              node_label: { type: string }
                              contribution_pct: { type: number }
                              edge_count: { type: integer }
                        delta_vs_baseline:
                          type: object
                          description: 'Delta vs identified baseline option (Task 1.7)'
                          properties:
                            p10: { type: number, description: 'Difference in p10 from baseline' }
                            p50: { type: number, description: 'Difference in p50 from baseline' }
                            p90: { type: number, description: 'Difference in p90 from baseline' }
                        constraint_violations:
                          type: array
                          description: 'Constraint violations for this option (Task 1.3)'
                          items:
                            type: object
                            properties:
                              option_id: { type: string, description: 'Option ID that violates the constraint' }
                              constraint_id: { type: string, description: 'Constraint identifier' }
                              constraint_label: { type: string, description: 'Human-readable constraint label' }
                              actual_value: { type: number, description: 'Actual value that violated the constraint' }
                              threshold: { type: number, description: 'Threshold value from the constraint' }
                        infeasible:
                          type: boolean
                          description: 'Is this option infeasible due to constraint violations? (Task 1.3)'
                        model_card:
                          type: object
                          properties:
                            seed: { type: integer, description: 'Per-scenario seed (base_seed + index + 1)' }
                            nodes: { type: integer }
                            edges: { type: integer }
                            backend: { type: string, enum: [scm_lite, fallback] }
                            detail_level: { type: string, enum: [quick, standard, deep] }
                            K: { type: integer, description: 'Samples evaluated (if available)' }
                            response_hash: { type: string, pattern: '^[0-9a-f]{16}$' }
                            duplicate: { type: boolean, description: 'True if this result matches a prior scenario' }
                            inference_error: { type: string, description: 'Error message if inference failed' }
                  ranking_summary:
                    type: object
                    description: 'Summary of ranking results. Present when include_ranking=true.'
                    properties:
                      winner: { type: string, description: 'Label of the winning option' }
                      winner_p50: { type: number, description: 'p50 value of the winner' }
                      margin: { type: number, nullable: true, description: 'Absolute difference between winner and runner-up' }
                      margin_pct: { type: number, nullable: true, description: 'Margin as percentage of runner-up value' }
                      ranking_confidence:
                        type: string
                        enum: [high, medium, low]
                        description: 'Confidence based on distribution overlap'
                      ranked_count: { type: integer, description: 'Number of options successfully ranked' }
                      excluded:
                        type: array
                        items: { type: string }
                        description: 'Labels of options excluded due to errors'
                      winner_dominant:
                        type: boolean
                        description: 'True if winner dominates all others (p10, p50, p90 all better)'
                  ranking_mode_used:
                    type: string
                    enum: [simple, utility]
                    description: 'Ranking mode used. simple=rank by p50. utility=reserved for future utility-based ranking.'
                  primary_outcome_used:
                    type: string
                    description: 'Node ID of the primary outcome used for ranking'
                  primary_outcome_detected:
                    type: boolean
                    description: 'True if primary outcome was auto-detected (not specified in request)'
                  utility_suggestion:
                    type: object
                    description: 'Suggestion to use utility mode when multiple outcome nodes detected'
                    properties:
                      message: { type: string }
                      applicable: { type: boolean }
                      outcome_nodes:
                        type: array
                        items: { type: string }
                  warnings:
                    type: array
                    description: 'Warnings about inferred or defaulted values'
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum: [EDGE_TYPE_INFERRED, PRIMARY_OUTCOME_INFERRED, BELIEF_DEFAULTED, UTILITY_MODE_EXPERIMENTAL]
                        message: { type: string }
                        affected_ids:
                          type: array
                          items: { type: string }
                        severity:
                          type: string
                          enum: [info, warning]
                  edge_type_inference:
                    type: object
                    description: 'Summary of edge type inference for observability'
                    properties:
                      explicit_count: { type: integer, description: 'Edges with explicit types' }
                      inferred_count: { type: integer, description: 'Edges with inferred types' }
                      inferred_edges:
                        type: array
                        items:
                          type: object
                          properties:
                            edge_id: { type: string }
                            inferred_type: { type: string, enum: [functional, structural, probabilistic] }
                  constraint_status:
                    type: object
                    description: 'Optional. Constraint status with violations and active constraints (Task 1.3). Only present when constraints are defined in the graph.'
                    properties:
                      violations:
                        type: array
                        description: 'List of constraint violations by option'
                        items:
                          type: object
                          required: [option_id, constraint_id, constraint_label, actual_value, threshold]
                          properties:
                            option_id: { type: string, description: 'Option/scenario ID that violates the constraint' }
                            constraint_id: { type: string, description: 'Constraint identifier' }
                            constraint_label: { type: string, description: 'Human-readable constraint label' }
                            actual_value: { type: number, description: 'Actual value that violated the constraint' }
                            threshold: { type: number, description: 'Threshold value from the constraint' }
                      active_constraints:
                        type: array
                        description: 'List of constraints that are active (at boundary)'
                        items:
                          type: object
                          required: [constraint_id, constraint_label, binding_option]
                          properties:
                            constraint_id: { type: string, description: 'Constraint identifier' }
                            constraint_label: { type: string, description: 'Human-readable constraint label' }
                            binding_option: { type: string, description: 'Option/scenario where this constraint is binding' }
                  coherence_warnings:
                    type: array
                    description: 'Coherence warnings about inference results (Task 1.6)'
                    items:
                      type: object
                      required: [code, message, severity]
                      properties:
                        code:
                          type: string
                          enum: [TOP_OPTION_NEGATIVE, CLOSE_RACE, ALL_OPTIONS_NEGATIVE, BASELINE_BEATS_ALL, HIGH_UNCERTAINTY, CONTRADICTORY_DIRECTION]
                          description: 'Machine-readable warning code'
                        message: { type: string, description: 'Human-readable warning message' }
                        severity:
                          type: string
                          enum: [info, warning, error]
                          description: 'Severity of the warning'
                        context:
                          type: object
                          description: 'Additional context data'
                          additionalProperties: true
                  edge_function_warnings:
                    type: array
                    description: 'Edge function sensitivity warnings (Phase 3, Task 4.3). Separate from coherence_warnings for schema clarity.'
                    items:
                      type: object
                      required: [code, message, severity]
                      properties:
                        code:
                          type: string
                          enum: [EDGE_FUNCTION_SENSITIVITY_HIGH, EDGE_FUNCTION_PARAM_OUT_OF_RANGE, MIXED_COMBINATION_COMPLEX]
                          description: 'Machine-readable warning code for edge function issues'
                        message: { type: string, description: 'Human-readable warning message' }
                        severity:
                          type: string
                          enum: [info, warning, error]
                          description: 'Severity of the warning'
                        context:
                          type: object
                          description: 'Additional context data (e.g., affected edge IDs)'
                          additionalProperties: true
                  # baseline_label moved to meta (single source of truth)
                  model_card:
                    type: object
                    properties:
                      seed: { type: integer }
                      detail_level: { type: string, enum: [quick, standard, deep] }
                      backend: { type: string, example: "scm_lite" }
                      response_hash: { type: string }
                  meta:
                    type: object
                    properties:
                      seed: { type: integer }
                      total_scenarios: { type: integer }
                      unique_results: { type: integer }
                      inference_mode:
                        type: string
                        enum: [model_based, mixed]
                        description: "'model_based' if all scenarios used SCM-Lite; 'mixed' if any scenario used fallback"
                      all_scenarios_succeeded:
                        type: boolean
                        description: "True if all scenarios used SCM-Lite inference; false if any used fallback"
                      fallback_count:
                        type: integer
                        description: "Number of scenarios that used fallback (only present when > 0)"
                      baseline_label:
                        type: string
                        description: "Label of the baseline scenario (first delta or 'Baseline')"
                      baseline_index:
                        type: integer
                        description: "Index of the baseline scenario in results array"
                      evidence_applied: { type: array, items: { type: object } }
        '400':
          description: Bad input
          content:
            application/json:
              examples:
                invalid_delta:
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "Delta label is required"
        '409':
          description: Idempotency key reused with a different request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                mismatch:
                  value:
                    schema: error.v1
                    code: IDEMPOTENCY_MISMATCH
                    message: Idempotency-Key was reused with a different request body; use a new key.

  /v1/run_timeslices:
    post:
      summary: Run Timeslices
      description: Evaluate graph across multiple time periods with optional overrides
      operationId: runTimeslices
      tags: [v1, inference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph, timeslices]
              properties:
                graph: { $ref: '#/components/schemas/graph' }
                timeslices:
                  type: array
                  maxItems: 12
                  items: { type: string }
                slice_overrides:
                  type: array
                  items:
                    type: object
                    required: [slice]
                    properties:
                      slice: { type: string }
                      nodes:
                        type: array
                        items: { type: object }
                      edges:
                        type: array
                        items: { type: object }
                priors: { type: object }
                evidence:
                  type: array
                  items:
                    type: object
                    required: [node_id, source]
                    properties:
                      node_id: { type: string }
                      source: { type: string }
                      note: { type: string }
                      weight: { type: number, minimum: 0, maximum: 1 }
                seed: { type: integer }
            examples:
              basic:
                value:
                  graph:
                    nodes: [{ id: "demand", label: "Demand" }]
                    edges: []
                  timeslices: ["Q1", "Q2", "Q3", "Q4"]
                  slice_overrides:
                    - slice: "Q2"
                      nodes: [{ id: "demand", value: 1.2 }]
                  priors: { demand: 0.6 }
                  seed: 4242
      responses:
        '200':
          description: Timeslices results
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema: { type: string, example: "run_timeslices.v1" }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        slice: { type: string }
                        summary:
                          type: object
                          properties:
                            p10: { type: number }
                            p50: { type: number }
                            p90: { type: number }
                        confidence: { type: number }
                  model_card:
                    type: object
                    properties:
                      seed: { type: integer }
                      response_hash: { type: string }
                      timeslices_count: { type: integer }
                  meta:
                    type: object
                    properties:
                      evidence_applied:
                        type: array
                        items:
                          type: object
                          properties:
                            node_id: { type: string }
                            source: { type: string }
                            weight: { type: number }
        '400':
          description: Bad input
          content:
            application/json:
              examples:
                too_many_slices:
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "Maximum 12 timeslices allowed"
                invalid_prior:
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "Prior value must be between 0 and 1"

  /v1/suggest/edge-function:
    post:
      operationId: suggestEdgeFunction
      tags: [cee-proxy]
      summary: Suggest edge function for a relationship
      description: |
        Suggests an appropriate edge function type (linear, diminishing_returns, threshold, s_curve)
        for a given edge relationship. Proxies to CEE /assist/v1/suggest-edge-function when available,
        with fallback to linear default.

        **Use Cases:**
        - Marketing spend → Revenue: suggests diminishing_returns (saturation at high spend)
        - Regulatory compliance → Operation: suggests threshold (binary compliance gate)
        - Market adoption → Sales: suggests s_curve (adoption lifecycle)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [edge_id, source_node, target_node]
              properties:
                edge_id:
                  type: string
                  description: 'Edge identifier (from->to)'
                  example: "marketing_spend->revenue"
                source_node:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string }
                    label: { type: string }
                    kind: { type: string, enum: [goal, decision, option, outcome, risk, action, factor] }
                target_node:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string }
                    label: { type: string }
                    kind: { type: string, enum: [goal, decision, option, outcome, risk, action, factor] }
                relationship_description:
                  type: string
                  description: 'Optional description of the relationship for better suggestions'
                  example: "Higher marketing spend increases revenue but with diminishing effectiveness"
                graph:
                  type: object
                  description: 'Optional graph context for node enrichment'
                  properties:
                    nodes:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { type: string }
                          label: { type: string }
                          kind: { type: string }
                    edges:
                      type: array
                      items:
                        type: object
                        properties:
                          from: { type: string }
                          to: { type: string }
            examples:
              basic:
                summary: Basic edge function suggestion
                value:
                  edge_id: "marketing_spend->revenue"
                  source_node:
                    id: "marketing_spend"
                    label: "Marketing Spend"
                  target_node:
                    id: "revenue"
                    label: "Revenue"
                  relationship_description: "Marketing investment drives revenue growth"
              with_graph:
                summary: With graph context for enrichment
                value:
                  edge_id: "compliance->operations"
                  source_node:
                    id: "compliance"
                  target_node:
                    id: "operations"
                  graph:
                    nodes:
                      - { id: "compliance", label: "Regulatory Compliance", kind: "action" }
                      - { id: "operations", label: "Business Operations", kind: "outcome" }
                    edges:
                      - { from: "compliance", to: "operations" }
      responses:
        '200':
          description: Edge function suggestion
          content:
            application/json:
              schema:
                type: object
                required: [schema, suggestion, edge_context, provenance]
                properties:
                  schema:
                    type: string
                    enum: [edge_function_suggestion.v1]
                  suggestion:
                    type: object
                    required: [suggested_function, suggested_params, reasoning, confidence]
                    properties:
                      suggested_function:
                        type: string
                        enum: [linear, diminishing_returns, threshold, s_curve]
                        description: 'Suggested edge function type'
                      suggested_params:
                        type: object
                        description: 'Suggested parameters for the function'
                        properties:
                          k:
                            type: number
                            description: 'Rate parameter for diminishing_returns/s_curve'
                          threshold:
                            type: number
                            description: 'Threshold value for threshold function'
                          midpoint:
                            type: number
                            description: 'Midpoint for s_curve function'
                          slope:
                            type: number
                            description: 'Slope for threshold function'
                      reasoning:
                        type: string
                        description: 'Explanation for the suggestion'
                      alternatives:
                        type: array
                        description: 'Alternative function suggestions'
                        items:
                          type: object
                          properties:
                            function_type: { type: string }
                            params: { type: object }
                            reasoning: { type: string }
                      confidence:
                        type: string
                        enum: [high, medium, low]
                  edge_context:
                    type: object
                    properties:
                      edge_id: { type: string }
                      source_node:
                        type: object
                        properties:
                          id: { type: string }
                          label: { type: string }
                          kind: { type: string }
                      target_node:
                        type: object
                        properties:
                          id: { type: string }
                          label: { type: string }
                          kind: { type: string }
                  provenance:
                    type: string
                    enum: [cee, plot_fallback]
                    description: 'Source of the suggestion'
                  cee_error:
                    type: object
                    description: 'Present if CEE call failed'
                    properties:
                      code: { type: string }
                      message: { type: string }
                      retryable: { type: boolean }
              examples:
                cee_success:
                  summary: CEE suggestion (diminishing returns)
                  value:
                    schema: "edge_function_suggestion.v1"
                    suggestion:
                      suggested_function: "diminishing_returns"
                      suggested_params:
                        k: 0.5
                      reasoning: "Marketing spend typically shows diminishing returns - initial investment yields high returns but effectiveness decreases as spend increases."
                      alternatives:
                        - function_type: "s_curve"
                          params: { k: 1.0, midpoint: 50000 }
                          reasoning: "If there's a threshold before marketing becomes effective, an S-curve may be more appropriate."
                      confidence: "high"
                    edge_context:
                      edge_id: "marketing_spend->revenue"
                      source_node:
                        id: "marketing_spend"
                        label: "Marketing Spend"
                      target_node:
                        id: "revenue"
                        label: "Revenue"
                    provenance: "cee"
                fallback:
                  summary: Fallback response (CEE unavailable)
                  value:
                    schema: "edge_function_suggestion.v1"
                    suggestion:
                      suggested_function: "linear"
                      suggested_params: {}
                      reasoning: "Default linear relationship (CEE unavailable)"
                      confidence: "low"
                    edge_context:
                      edge_id: "A->B"
                      source_node:
                        id: "A"
                        label: "A"
                      target_node:
                        id: "B"
                        label: "B"
                    provenance: "plot_fallback"
                    cee_error:
                      code: "CEE_TIMEOUT"
                      message: "Request timed out after 10000ms"
                      retryable: true
        '400':
          description: Bad input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                missing_edge_id:
                  summary: Missing required edge_id
                  value:
                    schema: "error.v1"
                    code: "BAD_INPUT"
                    message: "edge_id is required"

  # =============================================================================
  # V2 API - Option Comparison Mode
  # =============================================================================

  /v2/run:
    head:
      summary: Probe V2 run endpoint availability
      operationId: headRunV2
      tags: [v2, meta]
      description: |
        Returns 405 Method Not Allowed with Allow header. Use POST for option comparison.
      responses:
        '405':
          description: Method Not Allowed - Use POST for option comparison
          headers:
            Allow:
              schema: { type: string, example: 'POST, OPTIONS, HEAD' }
    post:
      summary: Execute option comparison with explicit interventions
      operationId: runV2
      tags: [v2, inference]
      description: |
        V2 endpoint with canonical option-comparison model:
        - Options are intervention bundles (not graph nodes)
        - Strict preflight validation with BLOCKER critiques
        - No intervention synthesis - requires explicit interventions
        - Option/decision nodes filtered from graph before analysis

        **Required Fields**:
        - `graph`: Causal graph with nodes and edges
        - `options`: Array of intervention bundles (min 2 for comparison)
        - `goal_node_id`: Target node for outcome measurement
        - `seed`: Random seed (accepts string or number, normalised to string internally)

        **Top-Level Status** (NOT UI vocabulary):
        - `analysis_status`: 'computed' | 'partial' | 'failed' (HTTP 200) or 'blocked' (HTTP 422)

        **Per-Feature Status** (UI vocabulary ONLY):
        - `option_comparison_status`: 'computed' | 'unavailable' | 'skipped' | 'error'
        - `robustness_status`: 'computed' | 'unavailable' | 'skipped' | 'error'
        - `drivers_status`: 'computed' | 'unavailable' | 'skipped' | 'error'

        **Response Hash**:
        - `response_hash`: 16-char hex hash computed from semantic fields only (for determinism)

        **Seed Handling**:
        - Accept string (canonical) or number (legacy)
        - Normalise to string internally
        - Echo as `meta.seed_used` (always string, e.g., "42")

        **422 Envelope Exception**:
        This endpoint returns unwrapped V2RunError on 422, NOT wrapped in error.v1 envelope.
        This is a documented PoC exception.

        **Preflight Validation**:
        All validation failures return BLOCKER critiques with HTTP 422. Blocker codes:
        - GOAL_NODE_NOT_IN_GRAPH
        - NO_OPTIONS
        - EMPTY_INTERVENTIONS
        - INVALID_INTERVENTION_TARGET
        - INVALID_INTERVENTION_VALUE
        - NO_PATH_TO_GOAL
        - IDENTICAL_OPTIONS
        - GRAPH_CYCLE_DETECTED
        - GRAPH_TOO_LARGE (max 50 nodes, 100 edges)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/runRequestV3'
            examples:
              basic_comparison:
                summary: Compare two intervention options
                value:
                  graph:
                    nodes:
                      - id: "budget"
                        label: "Marketing Budget"
                        kind: "factor"
                      - id: "awareness"
                        label: "Brand Awareness"
                        kind: "factor"
                      - id: "revenue"
                        label: "Revenue"
                        kind: "outcome"
                    edges:
                      - from: "budget"
                        to: "awareness"
                        exists_probability: 0.9
                        strength: { mean: 0.7, std: 0.1 }
                      - from: "awareness"
                        to: "revenue"
                        exists_probability: 0.95
                        strength: { mean: 0.6, std: 0.15 }
                  options:
                    - id: "opt1"
                      label: "Increase Budget"
                      interventions:
                        budget: { value: 100000 }
                    - id: "opt2"
                      label: "Double Budget"
                      interventions:
                        budget: { value: 200000 }
                  goal_node_id: "revenue"
                  seed: "42"
                  n_samples: 1000
                  detail_level: "deep"
      responses:
        '200':
          description: OK - Analysis complete (may be available or unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runResponseV3'
              examples:
                computed:
                  summary: Analysis fully computed
                  value:
                    request_schema_version: "v3"
                    endpoint_version: "v2/run"
                    preflight_version: "2025-12-26"
                    request_id: "req-abc123"
                    analysis_status: "computed"
                    option_comparison_status: "computed"
                    robustness_status: "computed"
                    drivers_status: "computed"
                    critiques: []
                    option_comparison:
                      - option_id: "opt1"
                        option_label: "Increase Budget"
                        expected_outcome: 150000
                        confidence_interval: [120000, 180000]
                        probability_of_goal: 0.72
                      - option_id: "opt2"
                        option_label: "Double Budget"
                        expected_outcome: 220000
                        confidence_interval: [180000, 260000]
                        probability_of_goal: 0.85
                    response_hash: "a1b2c3d4e5f67890"
                    meta:
                      seed_used: "42"
                      n_samples: 1000
                      detail_level: "standard"
                      latency_ms: 245
                partial:
                  summary: Some analyses computed, others unavailable
                  value:
                    request_schema_version: "v3"
                    endpoint_version: "v2/run"
                    preflight_version: "2025-12-26"
                    request_id: "req-abc123"
                    analysis_status: "partial"
                    status_reason: "Robustness analysis unavailable"
                    option_comparison_status: "computed"
                    robustness_status: "unavailable"
                    drivers_status: "computed"
                    critiques: []
                    option_comparison:
                      - option_id: "opt1"
                        option_label: "Increase Budget"
                        expected_outcome: 150000
                        confidence_interval: [120000, 180000]
                        probability_of_goal: 0.72
                    response_hash: "a1b2c3d4e5f67890"
                    meta:
                      seed_used: "42"
                      n_samples: 1000
                      detail_level: "standard"
                      latency_ms: 245
        '400':
          description: Bad Request - Invalid input (schema validation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                missing_required:
                  value:
                    schema: error.v1
                    code: BAD_INPUT
                    message: "body must have required property 'goal_node_id'"
        '422':
          description: Unprocessable Entity - Preflight validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2RunError'
              examples:
                goal_not_in_graph:
                  summary: Goal node not found
                  value:
                    analysis_status: "blocked"
                    status_reason: "Goal node \"nonexistent\" not found in graph"
                    critiques:
                      - id: "crit-001"
                        code: "GOAL_NODE_NOT_IN_GRAPH"
                        severity: "blocker"
                        message: "Goal node \"nonexistent\" not found in graph. Select an existing node as the goal, or add the goal node to the graph."
                        source: "validation"
                        affected_node_ids: ["nonexistent"]
                        blocks_analysis: true
                goal_not_causal:
                  summary: Goal node is a non-causal type (option/decision)
                  value:
                    analysis_status: "blocked"
                    status_reason: "Goal node \"my_decision\" is a decision node"
                    critiques:
                      - id: "crit-003"
                        code: "GOAL_NODE_NOT_CAUSAL"
                        severity: "blocker"
                        message: "Goal node \"my_decision\" is a decision node, which cannot be used as an analysis target. Select a factor, outcome, risk, or goal node as the analysis target."
                        source: "validation"
                        affected_node_ids: ["my_decision"]
                        blocks_analysis: true
                invalid_intervention_target:
                  summary: Intervention targets non-existent node
                  value:
                    analysis_status: "blocked"
                    status_reason: "Preflight validation failed"
                    critiques:
                      - id: "crit-002"
                        code: "INVALID_INTERVENTION_TARGET"
                        severity: "blocker"
                        message: "Option 'Bad Option' intervenes on node 'nonexistent_node' which does not exist."
                        source: "validation"
                        affected_option_ids: ["option_bad"]
                        affected_node_ids: ["nonexistent_node"]
                        blocks_analysis: true


components:
  schemas:
    # v1 error envelope (runtime validation and BAD_INPUT taxonomy)
    # Note: errorV1 is the shared error envelope across v1 routes
    # (run/counterfactual/critique/draft/stream/health/version) for
    # 400/401/403/429 where applicable.
    errorV1:
      type: object
      required: [schema, code, message]
      properties:
        schema:
          type: string
          enum: [error.v1]
        code:
          type: string
          enum: [BAD_INPUT, SCOPE_LIMIT, UNAUTHORIZED, FORBIDDEN, RATE_LIMITED, RATE_LIMIT, TIMEOUT, RETRYABLE, INTERNAL, BREAKER_OPEN, NOT_FOUND, IDEMPOTENCY_MISMATCH]
        message:
          type: string
        retryable:
          type: boolean
        source:
          type: string
        request_id:
          type: string
        degraded:
          type: boolean
        reason:
          type: string
        recovery:
          type: object
          additionalProperties: true
        path:
          type: array
          items: { type: string }
        details:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
    sseEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum: [hello, token, cost, done, cancelled, limited, error]
        id:
          type: string
        data:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
    reportV1:
      type: object
      required: [schema, meta]
      properties:
        schema:
          type: string
          enum: [report.v1]
        meta:
          type: object
          required: [seed]
          properties:
            seed: { type: integer }

    templateList:
      type: array
      description: 'List of available templates'
      items:
        type: object
        required: [id, label, summary, updated_at]
        properties:
          id: { type: string }
          label: { type: string }
          summary: { type: string }
          updated_at:
            type: string
            format: date-time

    # ========================================
    # /v1 SCHEMAS
    # ========================================

    # Structured Insights with Node/Edge References (Phase 2A)
    nodeReference:
      type: object
      description: 'Reference to a graph node for UI highlighting/navigation'
      required: [node_id, node_label]
      properties:
        node_id:
          type: string
          description: 'Node identifier'
        node_label:
          type: string
          description: 'Human-readable node label'

    edgeReference:
      type: object
      description: 'Reference to a graph edge for UI highlighting/navigation'
      required: [from_id, from_label, to_id, to_label]
      properties:
        from_id:
          type: string
          description: 'Source node identifier'
        from_label:
          type: string
          description: 'Source node label'
        to_id:
          type: string
          description: 'Target node identifier'
        to_label:
          type: string
          description: 'Target node label'

    structuredInsight:
      type: object
      description: 'Insight with optional node/edge references for UI interaction'
      required: [text]
      properties:
        text:
          type: string
          description: 'Human-readable insight text'
        node_references:
          type: array
          items:
            $ref: '#/components/schemas/nodeReference'
          description: 'Nodes referenced in this insight'
        edge_references:
          type: array
          items:
            $ref: '#/components/schemas/edgeReference'
          description: 'Edges referenced in this insight'

    # Change Attribution (Phase 2B)
    affectedNode:
      type: object
      description: 'Node affected by a change'
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string

    changeDriver:
      type: object
      description: 'Individual driver of outcome change between scenarios'
      required: [change_type, description, contribution_to_delta, contribution_pct, affected_nodes]
      properties:
        change_type:
          type: string
          enum: [edge_added, edge_removed, edge_weight_changed, node_value_changed, node_added, node_removed]
          description: 'Type of structural change'
        description:
          type: string
          description: 'Human-readable description of the change'
        contribution_to_delta:
          type: number
          description: 'Estimated causal contribution to outcome delta'
        contribution_pct:
          type: integer
          minimum: 0
          maximum: 100
          description: 'Percentage of total change attributed to this driver'
        before_value:
          type: number
          description: 'Value before change (for modifications)'
        after_value:
          type: number
          description: 'Value after change (for modifications)'
        affected_nodes:
          type: array
          items:
            $ref: '#/components/schemas/affectedNode'
          description: 'Nodes involved in this change'

    changeAttribution:
      type: object
      description: 'Attribution explaining why outcomes differ between scenarios'
      required: [outcome_delta, primary_drivers, summary]
      properties:
        outcome_delta:
          type: number
          description: 'Net change in outcome between baseline and comparison'
        primary_drivers:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/changeDriver'
          description: 'Top drivers of outcome change, sorted by absolute contribution'
        summary:
          type: string
          description: 'Human-readable summary of the attribution'

    graph:
      type: object
      required: [nodes, edges]
      properties:
        version:
          type: string
          description: 'Template version (e.g., "1.2")'
        default_seed:
          type: integer
          minimum: 1
          description: 'Default seed for reproducibility'
        nodes:
          type: array
          maxItems: 50
          minItems: 1
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, maxLength: 100 }
              label: { type: string, maxLength: 200 }
              body: { type: string, maxLength: 200, description: 'Decision context or description' }
              type: { type: string, maxLength: 50, deprecated: true }
              kind:
                type: string
                enum: [goal, decision, option, outcome, risk, action, factor]
                description: 'Node classification aligned with CEE/ISL. See Platform Architecture Contract v1.3'
              prior:
                type: number
                minimum: 0
                maximum: 1
                description: 'Prior probability for option nodes [0..1]'
              utility:
                type: number
                minimum: -1
                maximum: 1
                description: 'Utility/payoff for outcome nodes [-1..+1]'
              effect:
                type: object
                description: 'Optional non-linear effect transform (backwards-compatible)'
                properties:
                  kind:
                    type: string
                    enum: [linear, threshold, piecewise_linear]
                    description: 'Effect type (default: linear)'
                  params:
                    type: object
                    description: 'Effect-specific parameters'
              # Phase 4: Sequential/multi-stage support
              stage:
                type: integer
                minimum: 0
                description: '0-indexed stage number for multi-stage decisions'
              stage_label:
                type: string
                maxLength: 100
                description: 'Human-readable stage label (e.g., "Launch Decision", "Pricing Decision")'
              resolves_at:
                type: string
                maxLength: 100
                description: 'ISO 8601 timestamp or relative time when uncertainty resolves'
              decision_timing:
                type: string
                maxLength: 100
                description: 'ISO 8601 timestamp or relative time when decision must be made'
              observed_state:
                type: object
                nullable: true
                description: 'Observed state for factor nodes. Only used for root factor nodes (no incoming edges in graph).'
                properties:
                  value:
                    type: number
                    description: 'The observed/current value of this factor'
                  baseline:
                    type: number
                    nullable: true
                    description: 'The baseline/previous value for comparison'
                  unit:
                    type: string
                    nullable: true
                    maxLength: 50
                    description: 'Unit of measurement (e.g., "£", "%", "users")'
                  source:
                    type: string
                    nullable: true
                    maxLength: 100
                    description: 'Source of the value (e.g., "brief_extraction", "user_input")'
        edges:
          type: array
          maxItems: 200
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: string, maxLength: 100 }
              to: { type: string, maxLength: 100 }
              label: { type: string, maxLength: 200 }
              weight: { type: number, minimum: -1000000, maximum: 1000000 }
              belief:
                type: number
                minimum: 0
                maximum: 1
                description: 'Inclusion confidence [0..1]. Ingress accepts legacy confidence/probability (mapped to belief). Templates emit default belief=1.0.'
              provenance:
                type: string
                maxLength: 100
                description: 'Source attribution (e.g., "template", "assumption", "user")'
              function_type:
                type: string
                enum: [linear, diminishing_returns, threshold, s_curve, noisy_or, noisy_and_not, logistic, mixed]
                default: linear
                description: |
                  Edge function type for value transformation.
                  - linear: Direct proportional effect (default)
                  - diminishing_returns: Effect decreases as value increases
                  - threshold: Step function at specified point
                  - s_curve: Sigmoid transition
                  - noisy_or: Probabilistic OR for generative causes (Phase 3). Requires weight in [0,1].
                  - noisy_and_not: Probabilistic AND-NOT for preventative causes (Brief 17). Requires base_rate param.
                  - logistic: Logistic combination for continuous→binary (k parameter controls steepness)
                  - mixed: Combination of generative and preventative causes (Brief 22). Requires ENABLE_MIXED_COMBINATION flag.
              function_params:
                type: object
                description: 'Parameters for non-linear edge functions. Required parameters depend on function_type.'
                properties:
                  k:
                    type: number
                    minimum: 0
                    exclusiveMinimum: true
                    description: 'Rate parameter for diminishing_returns and s_curve (must be > 0, default: 1). Higher k = faster saturation/steeper transition.'
                  threshold:
                    type: number
                    description: 'Threshold value for threshold function (default: 0). Values below this produce 0 output.'
                  midpoint:
                    type: number
                    description: 'S-curve midpoint value (where output = 0.5). Required for s_curve function.'
                  slope:
                    type: number
                    description: 'Post-threshold slope for threshold function (default: 1). Multiplies (x - threshold) above threshold.'
                  leak:
                    type: number
                    minimum: 0
                    maximum: 1
                    description: 'Background probability for noisy_or function (default: 0.01). P(Y=1) when all parents are 0.'
                  base_rate:
                    type: number
                    minimum: 0
                    maximum: 1
                    description: 'Base rate for noisy_and_not function. Required for noisy_and_not. P(Y=1) when all preventative causes are absent.'
                  logistic_k:
                    type: number
                    minimum: 0
                    exclusiveMinimum: true
                    description: 'Steepness parameter for logistic function (default: 1). Higher k = sharper transition.'
                  combination_mode:
                    type: string
                    enum: [nested, logistic]
                    description: 'Mode for mixed function_type (default: nested). nested = Noisy-OR wrapped in Noisy-AND-NOT; logistic = logistic combination.'
              strength_std:
                type: number
                exclusiveMinimum: 0
                description: |
                  Standard deviation of effect magnitude (EdgeV2.2).
                  If provided, used directly for Normal sampling: N(weight, strength_std).
                  If absent, derived from belief_strength for backward compatibility.
                  Must be > 0.
              confidence:
                type: number
                minimum: 0
                maximum: 1
                deprecated: true
                description: 'DEPRECATED: Use belief instead. Accepted on ingress, never emitted.'
              probability:
                type: number
                minimum: 0
                maximum: 1
                deprecated: true
                description: 'DEPRECATED: Use belief instead. Accepted on ingress, never emitted.'
        meta:
          type: object
          description: 'Template metadata'
          properties:
            roots:
              type: array
              items: { type: string }
              description: 'Root node IDs'
            leaves:
              type: array
              items: { type: string }
              description: 'Leaf node IDs'
            suggested_positions:
              type: object
              additionalProperties:
                type: object
                required: [x, y]
                properties:
                  x: { type: number }
                  y: { type: number }
        # Phase 4: Sequential/multi-stage decision graph metadata
        sequential_metadata:
          type: object
          description: |
            Metadata for sequential/multi-stage decision graphs (Phase 4).
            Scope: Graph structure annotation only. Does not alter inference behavior in PLoT-lite.
            For actual sequential inference with rollback/backward induction, use ISL /v1/analysis/sequential endpoint.
            Validation:
            - Missing stages → falls back to single-stage (non-sequential) inference
            - Empty stages[] with is_sequential=true → validation error
          properties:
            is_sequential:
              type: boolean
              description: 'Whether this graph represents a sequential decision problem'
            stages:
              type: array
              description: 'Ordered list of stage definitions'
              items:
                type: object
                required: [index, label, decisions, resolved_uncertainties]
                properties:
                  index:
                    type: integer
                    minimum: 0
                    description: '0-indexed stage number'
                  label:
                    type: string
                    maxLength: 100
                    description: 'Human-readable stage name'
                  time_horizon:
                    type: string
                    maxLength: 50
                    description: 'Optional time horizon description (e.g., "Q1 2025", "+6 months")'
                  decisions:
                    type: array
                    items: { type: string }
                    description: 'Node IDs of decisions to be made at this stage'
                  resolved_uncertainties:
                    type: array
                    items: { type: string }
                    description: 'Node IDs of uncertainties that resolve at this stage'
            default_discount_factor:
              type: number
              minimum: 0
              maximum: 1
              default: 1.0
              description: 'Default discount factor for future outcomes (0-1)'

    modelCard:
      type: object
      required: [seed, assumptions_summary, compute_budget, flags_on, determinism_note, response_hash]
      properties:
        seed: { type: integer }
        assumptions_summary:
          type: array
          items: { type: string }
        compute_budget:
          type: object
          properties:
            k_samples: { type: integer }
            downgraded: { type: boolean }
            downgrade_reason: { type: string }
        flags_on:
          type: array
          items: { type: string }
        determinism_note: { type: string }
        warnings:
          type: array
          items: { type: string }
          description: 'Optional warnings (e.g., zero baseline in counterfactual)'
        response_hash:
          type: string
          description: 'Canonical SHA-256 of the normalised response'
          pattern: '^[0-9a-f]{64}$'
        isl_enriched:
          type: boolean
          description: 'True if ISL enrichment was attempted'
        isl_endpoints_called:
          type: array
          items: { type: string }
          description: 'ISL endpoints that were called (e.g., ["validation", "sensitivity"])'
        evidence_freshness:
          $ref: '#/components/schemas/evidenceFreshnessSummary'
        provenance_summary:
          $ref: '#/components/schemas/provenanceSummary'

    confidenceBadge:
      type: object
      required: [level, reason, score, factors]
      properties:
        level: { type: string, enum: [low, medium, high] }
        reason: { type: string }
        score: { type: number, minimum: 0, maximum: 1 }
        factors:
          type: object
          properties:
            identifiability: { type: number }
            linearity_distance: { type: number }
            k_coverage: { type: number }
            calibration: { type: number }
    
    critiqueItem:
      type: object
      required: [severity, message]
      properties:
        severity: { type: string, enum: [BLOCKER, IMPROVEMENT, OBSERVATION] }
        message: { type: string }
        suggested_action: { type: string }
        auto_fixable: { type: boolean }
        source:
          type: string
          enum: [engine, isl, cee]
          description: 'Source that generated this critique'

    evidenceFreshnessSummary:
      type: object
      description: 'Summary of evidence timestamp recency across all evidence items'
      properties:
        total:
          type: integer
          description: 'Total number of evidence items'
        with_timestamp:
          type: integer
          description: 'Number of evidence items with a valid timestamp'
        oldest_days:
          type: integer
          nullable: true
          description: 'Maximum age in days among dated evidence items (null when none)'
        newest_days:
          type: integer
          nullable: true
          description: 'Minimum age in days among dated evidence items (null when none)'
        buckets:
          type: object
          description: 'Counts per freshness bucket'
          properties:
            FRESH: { type: integer }
            AGING: { type: integer }
            STALE: { type: integer }
            UNKNOWN: { type: integer }
    
    provenanceSummary:
      type: object
      description: 'Summary of graph provenance sources and coverage'
      properties:
        sources:
          type: array
          items: { type: string }
        source_count:
          type: integer
        edges_with_provenance:
          type: integer
        edges_total:
          type: integer
        coverage_ratio:
          type: number
          minimum: 0
          maximum: 1
          description: 'Proportion of edges with external evidence provenance'
        confidence_level:
          type: string
          enum: [low, medium, high, unknown]
        confidence_score:
          type: number
          minimum: 0
          maximum: 1
        collected_at:
          type: string
          format: date-time
          description: 'ISO 8601 timestamp when the provenance summary was computed'
    
    explainDelta:
      type: object
      required: [top_drivers, summary]
      properties:
        top_drivers:
          type: array
          items:
            type: object
            required: [node_id, node_label, contribution, sign, explanation]
            properties:
              node_id: { type: string }
              node_label: { type: string }
              contribution: { type: number }
              sign: { type: string, enum: ['+', '-'] }
              explanation: { type: string }
        summary: { type: string }
        top_edge_drivers:
          type: array
          description: 'P0: Top-3 edges by sensitivity'
          items:
            type: object
            properties:
              edge_id: { type: string }
              from: { type: string }
              to: { type: string }
              sensitivity: { type: number }
              rank: { type: integer }
    
    runRequest:
      type: object
      required: [graph]
      properties:
        graph: { $ref: '#/components/schemas/graph' }
        seed: { type: integer, default: 42, minimum: 0, maximum: 2147483647 }
        k_samples: { type: integer, default: 1000, minimum: 100, maximum: 10000 }
        treatment_node: { type: string, maxLength: 100 }
        outcome_node: { type: string, maxLength: 100 }
        baseline_value: { type: number, minimum: -1000000, maximum: 1000000 }
        targets:
          type: array
          description: 'Canonical: array of node IDs to target for inference'
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
          example: ["Revenue", "Profit"]
        query:
          type: object
          description: 'DEPRECATED: Legacy container for query.targets. Use top-level targets instead.'
          properties:
            targets:
              type: array
              description: 'Legacy: array of node IDs to target (use top-level targets field instead)'
              items:
                type: string
                minLength: 1
              minItems: 1
              uniqueItems: true
              example: ["Revenue"]
          additionalProperties: false
        detail_level:
          type: string
          enum: [quick, standard, deep]
          default: standard
          description: |
            Controls compute budget and feature enablement:
            - quick: K=16, no critique/sensitivity/CEE
            - standard: K=32, all features enabled (default)
            - deep: K=64, stricter convergence threshold (0.5%)
        inference_mode:
          type: string
          enum: [model_based, model_of_inference]
          default: model_based
          description: |
            Selects the inference engine for running the model:
            - model_based: Standard simulation-based inference (default).
              Uses Monte Carlo sampling to propagate beliefs through the causal graph.
            - model_of_inference: Meta-reasoning engine that wraps model_based inference.
              Provides additional quality assessment metadata including:
              * quality_assessment.overall_score (0-1): Overall inference quality
              * quality_assessment.confidence_level (high/medium/low): Result confidence
              * quality_assessment.identifiable: Whether causal effect is identifiable
              * quality_assessment.in_linear_range: Whether estimates are in linear range
              * reliability.estimate_stability (stable/moderate/volatile)
              * reliability.convergence_status (converged/marginal/not_converged)
              * diagnostics.issues/warnings/suggestions: Actionable feedback
            Note: model_of_inference adds ~5-10ms compute overhead per request.
        constraints:
          type: object
          description: Optional constraints for validation and modeling
          properties:
            bounds:
              type: object
              description: Min/max bounds for node values
              additionalProperties:
                type: object
                properties:
                  min:
                    type: number
                  max:
                    type: number
              example:
                X: {min: 0, max: 1}
                Y: {min: -10, max: 10}
            structure:
              type: object
              description: Structural constraints
              properties:
                forbid_edges:
                  type: array
                  description: List of forbidden edges [from, to]
                  items:
                    type: array
                    items:
                      type: string
                    minItems: 2
                    maxItems: 2
                  example: [["A", "B"], ["C", "D"]]
    
    runResponse:
      type: object
      required: [schema, request_id]
      properties:
        schema: { type: string, enum: [run.v1] }
        request_id:
          type: string
          description: 'Request identifier - echoed from X-Request-Id header or auto-generated UUID. Can be any string (UUID when auto-generated)'
        graph: { $ref: '#/components/schemas/graph' }
        results: { type: object }
        model_card: { $ref: '#/components/schemas/modelCard' }
        confidence: { $ref: '#/components/schemas/confidenceBadge' }
        linearity_warning: { type: object }
        threshold_crossings:
          type: array
          items: { type: object }
        fork_suggestions: { type: object }
        critique:
          type: array
          items: { $ref: '#/components/schemas/critiqueItem' }
        explain_delta: { $ref: '#/components/schemas/explainDelta' }
        identifiability: { type: string }
        insights:
          type: object
          description: 'P1: Human-readable summary with optional structured node references for UI interaction'
          properties:
            summary:
              type: string
              maxLength: 200
              description: 'Brief outcome summary'
            risks:
              type: array
              maxItems: 5
              items:
                oneOf:
                  - type: string
                    maxLength: 100
                  - $ref: '#/components/schemas/structuredInsight'
              description: 'Key risks identified from model quality signals (string or structured)'
            next_steps:
              type: array
              maxItems: 3
              items:
                oneOf:
                  - type: string
                    maxLength: 150
                  - $ref: '#/components/schemas/structuredInsight'
              description: 'Recommended actions for decision makers (string or structured)'
        graph_quality:
          type: object
          description: 'P1: Graph quality score (0-1) with breakdown'
          properties:
            score:
              type: number
              minimum: 0
              maximum: 1
              description: 'Weighted quality score'
            completeness:
              type: number
              minimum: 0
              maximum: 1
            evidence_coverage:
              type: number
              minimum: 0
              maximum: 1
              description: 'Proportion of edges with external evidence'
            balance:
              type: number
              minimum: 0
              maximum: 1
            issues_count:
              type: integer
            recommendation:
              type: string
        graph_health:
          type: object
          description: 'Graph health assessment for variance potential - detects conditions that cause flat/collapsed analysis results'
          properties:
            variance_status:
              type: string
              enum: [limited, healthy, unknown]
              description: 'Variance potential status'
            issues:
              type: array
              items:
                type: string
                enum: [uniform_weights, uniform_beliefs, single_path]
              description: 'Specific issues detected (only present if variance_status=limited)'
            suggestion:
              type: string
              description: 'Actionable suggestion for improving the graph'
            source:
              type: string
              enum: [engine, isl]
              description: 'Source of the assessment'
          required: [variance_status, source]
        sensitivity_summary:
          type: object
          description: 'P1: Sensitivity concentration analysis (standard/deep only)'
          properties:
            concentration:
              type: string
              enum: [high, medium, diffuse]
            top_n_explain_pct:
              type: number
              minimum: 0
              maximum: 1
            top_n:
              type: integer
            interpretation:
              type: string
        trace_id:
          type: string
          description: 'Optional client-provided trace identifier echoed from X-Trace-Id when TRACE_ID_PASSTHROUGH=1; may also be present when TRACE_MIN=1'
        result:
          type: object
          description: 'P0: Convenience fields for UI integration'
          properties:
            response_hash:
              type: string
              description: 'SHA-256 hash of canonical inputs for caching'
            summary:
              type: object
              description: 'Direct percentile access'
              properties:
                p10: { type: number }
                p50: { type: number }
                p90: { type: number }
        meta_reasoning:
          type: object
          description: |
            Meta-reasoning output (only present when inference_mode=model_of_inference).
            Provides quality assessment and diagnostic feedback about the inference results.
          properties:
            quality_assessment:
              type: object
              description: 'Overall quality metrics for the inference'
              properties:
                overall_score:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: 'Weighted quality score (0=poor, 1=excellent)'
                confidence_level:
                  type: string
                  enum: [high, medium, low]
                  description: 'Categorical confidence in the results'
                identifiable:
                  type: boolean
                  description: 'Whether the causal effect is identifiable via backdoor criterion'
                in_linear_range:
                  type: boolean
                  description: 'Whether estimates fall within linear/trustworthy range'
                graph_quality:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: 'Structural quality of the input graph'
            diagnostics:
              type: object
              description: 'Diagnostic information for debugging/improvement'
              properties:
                issues:
                  type: array
                  items: { type: string }
                  description: 'Critical issues that may affect result validity'
                warnings:
                  type: array
                  items: { type: string }
                  description: 'Non-critical concerns to be aware of'
                suggestions:
                  type: array
                  items: { type: string }
                  description: 'Actionable recommendations to improve results'
            reliability:
              type: object
              description: 'Reliability assessment of the estimates'
              properties:
                estimate_stability:
                  type: string
                  enum: [stable, moderate, volatile]
                  description: 'How stable the estimates are across samples'
                sensitivity_flag:
                  type: boolean
                  description: 'True if results are highly sensitive to input changes'
                convergence_status:
                  type: string
                  enum: [converged, marginal, not_converged]
                  description: 'Whether Monte Carlo sampling has converged'
        ceeReview:
          type: object
          description: 'CEE Decision Review payload (optional; only present when CEE_ORCHESTRATOR_ENABLE=1 and Idempotency-Key header provided)'
          properties:
            schema:
              type: string
              enum: [cee.decision-review.v1]
            response_hash:
              type: string
              description: 'Hash of the response being reviewed'
            seed:
              oneOf:
                - type: number
                - type: string
              description: 'Seed used for inference'
            inference_mode:
              type: string
              description: 'Inference mode (e.g., fallback, scm_lite)'
            graph_summary:
              type: object
              properties:
                nodes: { type: integer }
                edges: { type: integer }
            scenario_kind:
              type: string
              description: 'Optional scenario classification'
        ceeTrace:
          type: object
          description: 'CEE execution trace (optional; present when CEE is called)'
          required: [requestId, degraded, timestamp]
          properties:
            requestId:
              type: string
              description: 'Request ID for tracing'
            degraded:
              type: boolean
              description: 'True if CEE service was unavailable and degraded gracefully'
            timestamp:
              type: string
              format: date-time
              description: 'ISO 8601 timestamp of CEE call'
            featureVersion:
              type: string
              description: 'Optional CEE feature version'
        ceeError:
          type: object
          description: 'CEE error details (optional; only present when CEE call failed)'
          required: [suggestedAction]
          properties:
            code:
              type: string
              description: 'Error code'
            message:
              type: string
              description: 'Human-readable error message'
            traceId:
              type: string
              description: 'Trace ID for debugging'
            retryable:
              type: boolean
              description: 'Whether the request can be retried'
            suggestedAction:
              type: string
              enum: [retry, fix_input, fail]
              description: 'Recommended action to take'
        isl_validation:
          $ref: '#/components/schemas/islValidationResult'
        isl_sensitivity:
          $ref: '#/components/schemas/islSensitivityResult'
        enrichment:
          type: object
          nullable: true
          description: 'ISL enrichment data (present when detail_level != quick)'
          properties:
            causal_validation:
              type: object
              nullable: true
              description: 'Causal validation enrichment from ISL'
              properties:
                identifiable:
                  type: boolean
                  description: 'Whether causal effect is identifiable'
                confidence:
                  type: string
                  enum: [high, medium, low]
                  description: 'Confidence level of validation'
                adjustment_sets:
                  type: array
                  items:
                    type: array
                    items:
                      type: string
                  description: 'Valid adjustment sets for backdoor criterion'
                minimal_set:
                  type: array
                  items:
                    type: string
                  description: 'Minimal sufficient adjustment set'
                confounders:
                  type: array
                  items:
                    type: string
                  description: 'Identified confounders'
                instruments:
                  type: array
                  items:
                    type: string
                  description: 'Potential instrumental variables'
                warnings:
                  type: array
                  items:
                    type: string
                  description: 'Validation warnings'
                explanation:
                  type: object
                  properties:
                    summary:
                      type: string
                    reasoning:
                      type: string
            sensitivity_analysis:
              type: object
              nullable: true
              description: 'Sensitivity analysis enrichment from ISL'
              properties:
                overall_robustness:
                  type: string
                  enum: [robust, moderate, fragile]
                  description: 'Overall robustness assessment'
                edges:
                  type: array
                  items:
                    type: object
                    properties:
                      edge_id:
                        type: string
                      from:
                        type: string
                      to:
                        type: string
                      sensitivity_score:
                        type: number
                      existence_sensitivity:
                        type: number
                      magnitude_sensitivity:
                        type: number
                      impact_direction:
                        type: string
                        enum: [positive, negative]
                top_drivers:
                  type: array
                  items:
                    type: string
                  description: 'Top sensitivity drivers'
                fragile_edges:
                  type: array
                  items:
                    type: string
                  description: 'Edges that are most fragile'
                recommendations:
                  type: array
                  items:
                    type: string
                  description: 'Recommendations for improving robustness'
            metadata:
              type: object
              required: [isl_enabled, detail_level]
              description: 'Enrichment metadata'
              properties:
                isl_enabled:
                  type: boolean
                  description: 'Whether ISL was enabled for this request'
                detail_level:
                  type: string
                  enum: [quick, standard, deep]
                  description: 'Detail level used for the request'
                isl_latency_ms:
                  type: number
                  description: 'ISL call latency in milliseconds'
                isl_degraded:
                  type: boolean
                  description: 'Whether ISL call degraded gracefully'
                endpoints_called:
                  type: array
                  items:
                    type: string
                  description: 'List of ISL endpoints called'
        discrimination:
          $ref: '#/components/schemas/discriminationSignal'
        drivers_payload:
          $ref: '#/components/schemas/driversPayload'

    discriminationSignal:
      type: object
      description: 'Low-variance/flat outcome detection signal - helps identify when outcomes are too similar to discriminate between options'
      required: [status, metric, value, threshold]
      properties:
        status:
          type: string
          enum: [ok, low_discrimination]
          description: 'Whether outcomes discriminate meaningfully between options'
        metric:
          type: string
          enum: [quantile_spread, expected_value_delta, hhi_concentration]
          description: 'Metric used for discrimination detection'
        value:
          type: number
          minimum: 0
          description: 'Computed metric value (e.g., normalized spread). Values < threshold indicate low discrimination'
        threshold:
          type: number
          minimum: 0
          description: 'Threshold used for comparison (default: 0.05 for quantile_spread)'
        affected_option_ids:
          type: array
          items:
            type: string
          description: 'Option IDs affected by low discrimination (when applicable)'
        remediation_actions:
          type: array
          description: 'Actionable steps to improve discrimination'
          items:
            type: object
            required: [code, label]
            properties:
              code:
                type: string
                description: 'Machine-readable action code'
              label:
                type: string
                description: 'Human-readable action description'

    driversPayload:
      type: object
      description: 'Structured payload for key drivers with explicit status handling - never silently empty after a successful run'
      required: [status, informative]
      properties:
        status:
          type: string
          enum: [ok, cannot_compute, requires_run, low_discrimination]
          description: |
            Status of the drivers computation:
            - ok: Drivers computed successfully
            - cannot_compute: Unable to compute drivers (e.g., graph structure issue)
            - requires_run: Drivers require a full /v1/run call first
            - low_discrimination: Drivers computed but outcomes are too similar to be meaningful
        status_reason:
          type: string
          description: 'Human-readable explanation of the status'
        remediation_actions:
          type: array
          description: 'Actionable steps to resolve non-ok status'
          items:
            type: object
            required: [code, label]
            properties:
              code:
                type: string
                description: 'Machine-readable action code'
              label:
                type: string
                description: 'Human-readable action description'
        drivers:
          type: array
          description: 'List of key drivers (present when status is ok or low_discrimination)'
          items:
            type: object
            required: [id, kind]
            properties:
              id:
                type: string
                description: 'Driver identifier (edge_id format: from::to::index)'
              kind:
                type: string
                enum: [edge, node]
                description: 'Type of driver'
              label:
                type: string
                description: 'Human-readable label'
              sensitivity_score:
                type: number
                minimum: 0
                description: 'Sensitivity/impact score (0-1, typically)'
              details:
                type: string
                description: 'Optional short explanation (e.g., provenance)'
        informative:
          type: boolean
          description: 'False when drivers exist but are not meaningfully informative (e.g., due to low discrimination)'

    islValidationResult:
      type: object
      description: 'ISL causal validation result (optional; present when ISL_ENABLE=1 and detail_level != quick)'
      required: [status, confidence, source]
      properties:
        status:
          type: string
          enum: [identifiable, uncertain, cannot_identify]
          description: 'Causal identifiability status'
        confidence:
          type: string
          enum: [high, medium, low]
          description: 'Confidence level of the validation result'
        adjustment_sets:
          type: array
          description: 'Valid adjustment sets for causal identification'
          items:
            type: array
            items: { type: string }
        minimal_set:
          type: array
          description: 'Minimal adjustment set'
          items: { type: string }
        issues:
          type: array
          description: 'Structural issues detected'
          items:
            type: object
            properties:
              type: { type: string }
              description: { type: string }
              affected_nodes:
                type: array
                items: { type: string }
              suggested_action: { type: string }
        explanation:
          type: object
          properties:
            summary: { type: string }
            reasoning: { type: string }
        source:
          type: string
          enum: [isl, engine_fallback]
          description: 'Source of the result (isl = from ISL service, engine_fallback = local fallback)'

    islSensitivityResult:
      type: object
      description: 'ISL sensitivity analysis result (optional; present when ISL_ENABLE=1 and detail_level = deep)'
      required: [overall_robustness, sensitive_parameters, recommendations, source]
      properties:
        overall_robustness:
          type: string
          enum: [robust, moderate, fragile]
          description: 'Overall model robustness assessment'
        sensitive_parameters:
          type: array
          description: 'Parameters sorted by sensitivity (highest first)'
          items:
            type: object
            required: [parameter, sensitivity, impact_direction]
            properties:
              parameter:
                type: string
                description: 'Parameter identifier'
              sensitivity:
                type: number
                minimum: 0
                maximum: 1
                description: 'Sensitivity score (0=insensitive, 1=highly sensitive)'
              impact_direction:
                type: string
                enum: [positive, negative]
                description: 'Direction of impact when parameter increases'
        recommendations:
          type: array
          items: { type: string }
          description: 'Actionable recommendations based on sensitivity analysis'
        source:
          type: string
          enum: [isl, engine_fallback]
          description: 'Source of the result'

    counterfactualRequest:
      type: object
      required: [graph, intervention, outcome_node]
      properties:
        graph: { $ref: '#/components/schemas/graph' }
        intervention:
          type: object
          required: [node_id, from_value, to_value]
          properties:
            node_id: { type: string, maxLength: 100 }
            from_value: { type: number, minimum: -1000000, maximum: 1000000 }
            to_value: { type: number, minimum: -1000000, maximum: 1000000 }
        outcome_node: { type: string, maxLength: 100 }
        seed: { type: integer, default: 42, minimum: 0, maximum: 2147483647 }
        k_samples: { type: integer, default: 1000, minimum: 100, maximum: 10000 }
    
    counterfactualResponse:
      type: object
      required: [schema, intervention, graph, results, model_card, confidence]
      properties:
        schema: { type: string, enum: [counterfactual.v1] }
        intervention: { type: object }
        graph: { $ref: '#/components/schemas/graph' }
        results:
          type: object
          description: 'Results with baseline, counterfactual, delta, and percentage_change (null if baseline is zero)'
          properties:
            baseline: { type: object }
            counterfactual: { type: object }
            delta: { type: object }
            percentage_change:
              type: string
              nullable: true
              description: 'Percentage change string (nullable when baseline is zero)'
        model_card: { $ref: '#/components/schemas/modelCard' }
        confidence: { $ref: '#/components/schemas/confidenceBadge' }
        explain_delta: { $ref: '#/components/schemas/explainDelta' }
        identifiability: { type: string }
        adjustment_set: 
          type: array
          items: { type: string }
        trace_id:
          type: string
          description: 'Optional client-provided trace identifier echoed from X-Trace-Id when TRACE_ID_PASSTHROUGH=1'
    
    critiqueRequest:
      type: object
      required: [graph]
      properties:
        graph: { $ref: '#/components/schemas/graph' }
        assumptions:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 500 }
        treatment_node: { type: string, maxLength: 100 }
        outcome_node: { type: string, maxLength: 100 }
        seed: { type: integer, default: 0, minimum: 0, maximum: 2147483647 }
    
    critiqueResponse:
      type: object
      required: [schema, graph, critique, model_card]
      properties:
        schema: { type: string, enum: [critique.v1] }
        graph: { $ref: '#/components/schemas/graph' }
        critique:
          type: array
          items: { $ref: '#/components/schemas/critiqueItem' }
        model_card: { $ref: '#/components/schemas/modelCard' }
        identifiability: { type: string }
        summary:
          type: object
          properties:
            total_issues: { type: integer }
            blockers: { type: integer }
            improvements: { type: integer }
            observations: { type: integer }
            auto_fixable: { type: integer }
        trace_id:
          type: string
          description: 'Optional client-provided trace identifier echoed from X-Trace-Id when TRACE_ID_PASSTHROUGH=1'

    # =========================================================================
    # V3 Schemas - /v2/run Option Comparison Mode
    # =========================================================================

    runRequestV3:
      type: object
      required: [graph, options, goal_node_id]
      description: V2 run request with explicit intervention bundles
      properties:
        graph:
          type: object
          required: [nodes, edges]
          properties:
            nodes:
              type: array
              items:
                $ref: '#/components/schemas/nodeV3'
            edges:
              type: array
              items:
                $ref: '#/components/schemas/edgeV3'
        options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/optionV3'
        goal_node_id:
          type: string
          minLength: 1
          description: Target node for outcome measurement
        seed:
          oneOf:
            - type: string
            - type: number
          description: Random seed for determinism (accepts string or number, normalised to string internally)
        n_samples:
          type: number
          minimum: 100
          maximum: 10000
          description: Number of samples for Monte Carlo (default 1000)
        detail_level:
          type: string
          enum: [quick, standard, deep]
          description: Analysis detail level
        request_id:
          type: string
          description: Optional client-provided request ID
        idempotency_key:
          type: string
          description: Optional idempotency key for replay
        goal_threshold:
          type: number
          nullable: true
          description: |
            User-defined success threshold. When provided, response includes
            probability_of_goal per option indicating likelihood of outcome
            meeting or exceeding this value. Null is treated as absent.

    nodeV3:
      type: object
      required: [id]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9_:-]+$'
        label:
          type: string
        kind:
          type: string
          enum: [factor, outcome, option, decision, intermediate]
        observed_state:
          type: object
          properties:
            value:
              type: number
            baseline:
              type: number
            unit:
              type: string

    edgeV3:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
        exists_probability:
          type: number
          minimum: 0
          maximum: 1
          default: 1
        strength:
          type: object
          properties:
            mean:
              type: number
            std:
              type: number
              minimum: 0

    optionV3:
      type: object
      required: [id, label, interventions]
      properties:
        id:
          type: string
        label:
          type: string
        interventions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/interventionValueV3'

    interventionValueV3:
      type: object
      required: [value]
      properties:
        value:
          type: number
          description: Intervention value (must be finite)
        uncertainty:
          type: object
          description: Optional uncertainty specification
          properties:
            distribution:
              type: string
              enum: [normal, uniform]
            std:
              type: number
            min:
              type: number
            max:
              type: number

    v2RunError:
      type: object
      required: [analysis_status, status_reason, critiques]
      description: V2 run error response (unwrapped, NOT error.v1 envelope)
      properties:
        analysis_status:
          type: string
          enum: ['blocked']
          description: Always 'blocked' for 422 responses
        status_reason:
          type: string
          description: Reason for blocking
        critiques:
          type: array
          items:
            $ref: '#/components/schemas/critiqueV3'

    runResponseV3:
      type: object
      required: [request_schema_version, endpoint_version, preflight_version, request_id, analysis_status, option_comparison_status, robustness_status, drivers_status, critiques, meta]
      properties:
        request_schema_version:
          type: string
          enum: ['v3']
        endpoint_version:
          type: string
          enum: ['v2/run']
        preflight_version:
          type: string
          description: Date-based version of preflight validation
        request_id:
          type: string
        analysis_status:
          type: string
          enum: [computed, partial, failed]
          description: Top-level status (NOT UI vocabulary)
        status_reason:
          type: string
          description: Reason when status is not 'computed'
        option_comparison_status:
          type: string
          enum: [computed, unavailable, skipped, error]
          description: Per-feature status (UI vocabulary)
        robustness_status:
          type: string
          enum: [computed, unavailable, skipped, error]
          description: Per-feature status (UI vocabulary)
        drivers_status:
          type: string
          enum: [computed, unavailable, skipped, error]
          description: Per-feature status (UI vocabulary)
        isl_analysis_status:
          type: string
          description: ISL status echoed for debugging
        isl_status_reason:
          type: string
          description: ISL status reason echoed for debugging
        response_hash:
          type: string
          description: 16-char hex hash of canonical request (semantic fields only)
        critiques:
          type: array
          items:
            $ref: '#/components/schemas/critiqueV3'
        option_comparison:
          type: array
          items:
            type: object
            properties:
              option_id:
                type: string
              option_label:
                type: string
              expected_outcome:
                type: number
                description: Expected outcome value (deprecated - use outcome.mean)
              confidence_interval:
                type: array
                items:
                  type: number
                description: "[p10, p90] confidence interval (deprecated - use outcome.p10/p90)"
              outcome:
                type: object
                description: Full outcome statistics from ISL Monte Carlo simulation
                properties:
                  mean:
                    type: number
                  std:
                    type: number
                  p10:
                    type: number
                    description: 10th percentile (pessimistic)
                  p50:
                    type: number
                    description: 50th percentile (median)
                  p90:
                    type: number
                    description: 90th percentile (optimistic)
                  n_samples:
                    type: integer
                  n_valid_samples:
                    type: integer
                  validity_ratio:
                    type: number
              status:
                type: string
                enum: [computed, skipped, error]
              status_reason:
                type: string
              probability_of_goal:
                type: number
                minimum: 0
                maximum: 1
                description: |
                  Probability of outcome meeting or exceeding goal_threshold.
                  Only present when goal_threshold provided in request.
              win_probability:
                type: number
                minimum: 0
                maximum: 1
                description: |
                  Probability this option outperforms alternatives across
                  simulated scenarios.
        edge_sensitivity:
          type: array
          items:
            type: object
            properties:
              edge_id:
                type: string
              from:
                type: string
              to:
                type: string
              sensitivity_type:
                type: string
              elasticity:
                type: number
              importance_rank:
                type: integer
              interpretation:
                type: string
        factor_sensitivity:
          type: array
          items:
            type: object
            properties:
              factor_id:
                type: string
              sensitivity_score:
                type: number
              value_of_information:
                type: number
              direction:
                type: string
        robustness:
          type: object
          properties:
            score:
              type: number
            label:
              type: string
            fragile_edges:
              type: array
              items:
                type: string
            robust_edges:
              type: array
              items:
                type: string
            explanation:
              type: string
        meta:
          type: object
          required: [seed_used, n_samples, detail_level, latency_ms]
          properties:
            seed_used:
              type: string
              description: Seed used (always echoed as string, e.g., "42")
            n_samples:
              type: number
            detail_level:
              type: string
            latency_ms:
              type: number
            normalization_ms:
              type: number
            validation_ms:
              type: number
            isl_ms:
              type: number

    critiqueV3:
      type: object
      required: [id, code, severity, message, source, blocks_analysis]
      description: |
        Actionable critique with structured metadata.
        Blockers cause 422; warnings/info included in 200 responses.
      properties:
        id:
          type: string
          description: Unique critique identifier
        code:
          type: string
          description: |
            Programmatic blocker code. Known codes:
            - MISSING_GOAL_NODE: Goal node ID not provided
            - GOAL_NODE_NOT_IN_GRAPH: Goal node not found in graph
            - GOAL_NODE_NOT_CAUSAL: Goal is a non-causal node (option/decision)
            - NO_OPTIONS: No options provided for comparison
            - TOO_MANY_OPTIONS: Options exceed MAX_OPTIONS limit
            - EMPTY_INTERVENTIONS: Option has no interventions
            - INVALID_INTERVENTION_TARGET: Intervention targets non-existent node
            - INVALID_INTERVENTION_VALUE: Intervention value is invalid
            - NO_PATH_TO_GOAL: No causal path from intervention to goal
            - IDENTICAL_OPTIONS: Multiple options have identical interventions
            - INVALID_NODE_ID_PATTERN: Node ID contains invalid characters
            - INVALID_EDGE_ENDPOINT: Edge references non-existent node
            - DUPLICATE_NODE_IDS: Multiple nodes share same ID
            - GRAPH_TOO_LARGE: Graph exceeds limits (50 nodes, 100 edges)
            - GRAPH_CYCLE_DETECTED: Graph contains cycles
            - IDENTIFIABILITY_ISSUE: Causal model cannot be identified
            - ISL_CANNOT_IDENTIFY: ISL layer cannot identify effect
        severity:
          type: string
          enum: [info, warning, error, blocker]
        message:
          type: string
        source:
          type: string
          enum: [validation, isl]
        affected_option_ids:
          type: array
          items:
            type: string
        affected_node_ids:
          type: array
          items:
            type: string
        blocks_analysis:
          type: boolean

    draftResponse:
      type: object
      required: [schema, description, boards, model_card]
      properties:
        schema: { type: string, enum: [draft.v1] }
        description: { type: string }
        domain: { type: string }
        boards:
          type: array
          items:
            type: object
            required: [name, description, graph, critique, simplified]
            properties:
              name: { type: string }
              description: { type: string }
              graph: { $ref: '#/components/schemas/graph' }
              critique:
                type: array

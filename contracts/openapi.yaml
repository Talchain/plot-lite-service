openapi: 3.0.3
info:
  title: PLoT Engine API
  version: 1.0.0
  description: |
    PLoT Engine v1 - Deterministic, auditable probabilistic models with trust signals.
    
    **Trust Signals**: All /v1 responses include Model Card, Confidence badge, and Explain-Δ.
    
    **Demo Mode**: Add `?demo=1` or header `X-Demo: 1` for deterministic sample payloads.
    When present, demo mode short-circuits request validation and returns a canonical demo payload.
    
    **Feature Flags**:
    - FEATURE_STREAM=1 enables real SSE /stream route (test-only otherwise)
    - AUTH_ENABLED=1 requires Authorization: Bearer <token> on certain routes
    
    **Legacy Routes**: /draft-flows, /critique, /improve (v0) remain for backwards compatibility.
  contact:
    name: PLoT Engine
    url: https://github.com/Talchain/plot-lite-service
    email: devnull@talchain.ai
servers:
  - url: http://127.0.0.1:4311
    description: Local development
  - url: https://api.olumi.ai
    description: Production (future)
tags:
  - name: v1
    description: v1 API group
  - name: stream
    description: Streaming endpoints
  - name: health
    description: Health and status endpoints
  - name: meta
    description: Version and metadata endpoints
  - name: inference
    description: Inference endpoints
  - name: validation
    description: Validation and critique endpoints
  - name: ergonomics
    description: Drafting and UX endpoints
  - name: legacy
    description: Legacy endpoints for backwards compatibility
paths:
  /health:
    get:
      summary: Engine health
      description: Returns engine health and minimal status for legacy clients.
      operationId: healthLegacy
      tags: [health]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, p95_ms, test_routes_enabled, replay]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  p95_ms:
                    type: number
                  test_routes_enabled:
                    type: boolean
                  replay:
                    type: object
  /version:
    get:
      summary: Engine version
      description: Returns engine version and build metadata for legacy clients.
      operationId: versionLegacy
      tags: [meta]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [api, build, model]
                properties:
                  api:
                    type: string
                  build:
                    type: string
                  model:
                    type: string
  /draft-flows:
    get:
      summary: Deterministic report for a template+seed
      operationId: draftFlowsGet
      tags: [legacy]
      description: |
        Returns a deterministic report.v1 fixture by template and seed.
        Authentication may be required when AUTH_ENABLED=1.
      parameters:
        - name: template
          in: query
          required: true
          schema:
            type: string
            enum: [pricing_change, feature_launch, build_vs_buy]
        - name: seed
          in: query
          required: true
          schema:
            type: integer
        - name: budget
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { schema: { type: string } }
            ETag: { schema: { type: string } }
            Vary: { schema: { type: string } }
            Content-Length: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reportV1'
        '304':
          description: Not Modified
        '400':
          description: Bad input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                unauthorized:
                  value:
                    schema: error.v1
                    code: UNAUTHORIZED
                    message: Missing bearer token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                forbidden:
                  value:
                    schema: error.v1
                    code: FORBIDDEN
                    message: Invalid token
    
  /v1/templates:
    get:
      summary: List available templates
      operationId: templatesList
      tags: [v1, ergonomics]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/templateList'
              examples:
                example:
                  value:
                    - { id: small, label: Small Demo, summary: Minimal A→B graph, updated_at: '2025-01-01T00:00:00.000Z' }
                    - { id: medium, label: Medium Demo, summary: Price→Demand→Revenue (+Marketing), updated_at: '2025-01-01T00:00:00.000Z' }
                    - { id: edge, label: Edge Case, summary: Near-zero baseline, updated_at: '2025-01-01T00:00:00.000Z' }

  /v1/templates/{id}/graph:
    get:
      summary: Get canonical graph for a template
      operationId: templateGraph
      tags: [v1, ergonomics]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, enum: [small, medium, edge] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/graph'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                not_found:
                  value:
                    schema: error.v1
                    code: NOT_FOUND
                    message: Template 'unknown' not found
  
  /v1/stream:
    get:
      summary: Stream first tokens
      operationId: streamV1
      tags: [v1, stream]
      description: |
        Streams the first tokens for a run. `?demo=1`  short-circuits validation and returns a canonical deterministic sample.
      parameters:
        - in: query
          name: demo
          schema: { type: integer, enum: [0,1], default: 0 }
          description: Enable deterministic demo stream (short-circuit before validation).
        - in: query
          name: latency_ms
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
          description: Optional sleep to simulate latency (ms).
      responses:
        "200":
          description: Server-Sent Events stream
          headers:
            Content-Type:
              description: SSE content type with charset
              schema: { type: string, example: 'text/event-stream; charset=utf-8' }
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/sseEvent"
          x-examples:
            sse:
              description: Example first frames
              value: |
                event: hello
                data: {"schema":"hello.v1","trace_id":"11111111-2222-4333-8444-555555555555"}

                event: token
                data: {"t":"hello"}
        "400":
          description: Bad input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorV1"
        "401":
          description: Unauthorized (missing/expired token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorV1"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorV1"
        "429":
          description: Too many concurrent streams
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                oneOf:
                  - { type: integer, minimum: 0 }
                  - { type: string }
            X-RateLimit-Reason:
              description: Reason for rate limit decision
              schema: { type: string, enum: [per_ip, global] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorV1"
              examples:
                rate_limited:
                  value:
                    schema: error.v1
                    code: RATE_LIMITED
                    message: Too many streams
                    
  /v1/health:
    get:
      summary: v1 Health endpoint
      operationId: healthV1
      description: |
        Returns engine health and minimal status for v1 clients.
      tags: [v1, health]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  api_version: { type: string }
                  p95_ms: { type: number }
                  version: { type: string, description: 'API version string (optional)' }
                  uptime_s: { type: number, description: 'Process uptime in seconds (optional)' }
                  last_request_at: { type: string, description: 'ISO timestamp of last observed request (optional)' }
                  environment: { type: string, description: 'Optional environment name (e.g., staging, prod)' }
                  build: { type: string, description: 'Optional short build identifier' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                unauthorized:
                  value:
                    schema: error.v1
                    code: UNAUTHORIZED
                    message: Missing bearer token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                forbidden:
                  value:
                    schema: error.v1
                    code: FORBIDDEN
                    message: Invalid token
  
  /v1/version:
    get:
      summary: v1 Version and features
      operationId: versionV1
      description: |
        Returns engine version, build metadata, and feature flags for v1 clients.
      tags: [v1, meta]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [api, version, build, model, features]
                properties:
                  api: { type: string, example: 'plot-engine/v1' }
                  version: { type: string, example: '1.0.0' }
                  build: { type: string }
                  model: { type: string }
                  features:
                    type: object
                    properties:
                      trust_signals: { type: boolean }
                      model_card: { type: string }
                      confidence_badge: { type: boolean }
                      explain_delta: { type: boolean }
                      cost_governance: { type: boolean }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                unauthorized:
                  value:
                    schema: error.v1
                    code: UNAUTHORIZED
                    message: Missing bearer token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                forbidden:
                  value:
                    schema: error.v1
                    code: FORBIDDEN
                    message: Invalid token
  
  /v1/run:
    post:
      summary: Execute probabilistic model
      operationId: runV1
      tags: [v1, inference]
      description: |
        Run inference on a causal graph with full trust signals.
        Demo mode: `?demo=1` short-circuits validation and returns a canonical deterministic sample.
      parameters:
        - name: demo
          in: query
          required: false
          schema: { type: integer, enum: [0, 1] }
        - name: X-Demo
          in: header
          required: false
          schema: { type: string, enum: ['0', '1'] }
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional key to replay the exact prior response within a TTL (scoped per principal)
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/runRequest'
      responses:
        '200':
          description: OK
          headers:
            Idempotent-Replayed:
              description: '1 if response is a replay from cache; 0 if computed fresh (when Idempotency-Key provided)'
              schema: { type: string, enum: ['0','1'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runResponse'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                too_large:
                  value:
                    schema: error.v1
                    code: BAD_INPUT
                    message: Request entity too large
        '429':
          description: Too many requests (per-minute limit)
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema: { type: integer, minimum: 0 }
            X-RateLimit-Reset:
              description: Unix epoch seconds when the window resets
              schema: { type: string }
            X-RateLimit-Reason:
              description: Reason for rate limit decision
              schema: { type: string, enum: [per_ip] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                rate_limited:
                  value:
                    schema: error.v1
                    code: RATE_LIMITED
                    message: Too many requests
        '400':
          description: Bad input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                bad_input:
                  value:
                    schema: error.v1
                    code: BAD_INPUT
                    message: 'Missing required field: graph'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                unauthorized:
                  value:
                    schema: error.v1
                    code: UNAUTHORIZED
                    message: Missing bearer token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                forbidden:
                  value:
                    schema: error.v1
                    code: FORBIDDEN
                    message: Invalid token
  
  /v1/counterfactual:
    post:
      summary: Counterfactual analysis
      tags: [v1, inference]
      description: |
        Perform counterfactual intervention with trust signals.
        Demo mode: `?demo=1` short-circuits validation and returns a canonical deterministic sample.
      parameters:
        - name: demo
          in: query
          required: false
          schema: { type: integer, enum: [0, 1] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/counterfactualRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/counterfactualResponse'
        '400':
          description: Bad input or not identifiable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                bad_input:
                  value:
                    schema: error.v1
                    code: BAD_INPUT
                    message: 'Missing required field: graph'
        '429':
          description: Too many requests (per-minute limit)
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema: { type: integer, minimum: 0 }
            X-RateLimit-Reset:
              description: Unix epoch seconds when the window resets
              schema: { type: string }
            X-RateLimit-Reason:
              description: Reason for rate limit decision
              schema: { type: string, enum: [per_ip] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                rate_limited:
                  value:
                    schema: error.v1
                    code: RATE_LIMITED
                    message: Too many requests
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
  
  /v1/critique:
    post:
      summary: Model critique with fix suggestions
      tags: [v1, validation]
      operationId: critiqueV1
      description: |
        Analyse graph structure and return actionable issues.
        Demo mode: `?demo=1` short-circuits validation and returns a canonical deterministic sample.
      parameters:
        - name: demo
          in: query
          required: false
          schema: { type: integer, enum: [0, 1] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/critiqueRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/critiqueResponse'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                too_large:
                  value:
                    schema: error.v1
                    code: BAD_INPUT
                    message: Request entity too large
        '429':
          description: Too many requests (per-minute limit)
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema: { type: integer, minimum: 0 }
            X-RateLimit-Reset:
              description: Unix epoch seconds when the window resets
              schema: { type: string }
            X-RateLimit-Reason:
              description: Reason for rate limit decision
              schema: { type: string, enum: [per_ip] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                rate_limited:
                  value:
                    schema: error.v1
                    code: RATE_LIMITED
                    message: Too many requests
        '400':
          description: Bad input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                bad_input:
                  value:
                    schema: error.v1
                    code: BAD_INPUT
                    message: Field parse_json is required
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
  
  /v1/draft:
    post:
      summary: Text to model drafting
      tags: [v1, ergonomics]
      operationId: draftV1
      description: |
        Generate 2-3 starter boards from text description.
        Returns ≤12 node graphs with immediate critique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: 
                  type: string
                  maxLength: 500
                  example: 'Optimise subscription pricing with competitor response'
                domain:
                  type: string
                  enum: [pricing, product, marketing]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/draftResponse'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                too_large:
                  value:
                    schema: error.v1
                    code: BAD_INPUT
                    message: Request entity too large
        '429':
          description: Too many requests (per-minute limit)
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema: { type: integer, minimum: 0 }
            X-RateLimit-Reset:
              description: Unix epoch seconds when the window resets
              schema: { type: string }
            X-RateLimit-Reason:
              description: Reason for rate limit decision
              schema: { type: string, enum: [per_ip] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                rate_limited:
                  value:
                    schema: error.v1
                    code: RATE_LIMITED
                    message: Too many requests
        '400':
          description: Bad input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                bad_input:
                  value:
                    schema: error.v1
                    code: BAD_INPUT
                    message: Field description is required
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                unauthorized:
                  value:
                    schema: error.v1
                    code: UNAUTHORIZED
                    message: Missing bearer token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                forbidden:
                  value:
                    schema: error.v1
                    code: FORBIDDEN
                    message: Invalid token

  

components:
  schemas:
    # v1 error envelope (runtime validation and BAD_INPUT taxonomy)
    # Note: errorV1 is the shared error envelope across v1 routes
    # (run/counterfactual/critique/draft/stream/health/version) for
    # 400/401/403/429 where applicable.
    errorV1:
      type: object
      required: [schema, code, message]
      properties:
        schema:
          type: string
          enum: [error.v1]
        code: { type: string, enum: [BAD_INPUT, UNAUTHORIZED, FORBIDDEN, RATE_LIMITED, INTERNAL] }
        message: { type: string }
        path:
          type: array
          items: { type: string }
        details:
          type: object
          additionalProperties: true
    errorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type: { type: string }
            message: { type: string }
            hint: { type: string }
            fields: { type: object }
            retryable: { type: boolean }
            code: { type: string }
    sseEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum: [hello, token, cost, done, cancelled, limited, error]
        id:
          type: string
        data:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
    reportV1:
      type: object
      required: [schema, meta]
      properties:
        schema:
          type: string
          enum: [report.v1]
        meta:
          type: object
          required: [seed]
          properties:
            seed: { type: integer }
    
    # ========================================
    # /v1 SCHEMAS
    # ========================================
    
    templateItem:
      type: object
      required: [id, label, summary, updated_at]
      properties:
        id: { type: string }
        label: { type: string }
        summary: { type: string }
        updated_at: { type: string, format: date-time }

    templateList:
      type: array
      items:
        $ref: '#/components/schemas/templateItem'

    graph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          maxItems: 50
          minItems: 1
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, maxLength: 100 }
              label: { type: string, maxLength: 200 }
              type: { type: string, maxLength: 50 }
        edges:
          type: array
          maxItems: 200
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: string, maxLength: 100 }
              to: { type: string, maxLength: 100 }
              label: { type: string, maxLength: 200 }
              weight: { type: number, minimum: -1000000, maximum: 1000000 }
    
    modelCard:
      type: object
      required: [seed, assumptions_summary, compute_budget, flags_on, determinism_note, response_hash]
      properties:
        seed: { type: integer }
        assumptions_summary:
          type: array
          items: { type: string }
        compute_budget:
          type: object
          properties:
            k_samples: { type: integer }
            downgraded: { type: boolean }
            downgrade_reason: { type: string }
        flags_on:
          type: array
          items: { type: string }
        determinism_note: { type: string }
        warnings:
          type: array
          items: { type: string }
          description: 'Optional warnings (e.g., zero baseline in counterfactual)'
        response_hash:
          type: string
          description: 'Canonical SHA-256 of the normalised response'
          pattern: '^[0-9a-f]{64}$'
    
    confidenceBadge:
      type: object
      required: [level, reason, score, factors]
      properties:
        level: { type: string, enum: [LOW, MEDIUM, HIGH] }
        reason: { type: string }
        score: { type: number, minimum: 0, maximum: 1 }
        factors:
          type: object
          properties:
            identifiability: { type: number }
            linearity_distance: { type: number }
            k_coverage: { type: number }
            calibration: { type: number }
    
    critiqueItem:
      type: object
      required: [severity, message]
      properties:
        severity: { type: string, enum: [BLOCKER, IMPROVEMENT, OBSERVATION] }
        message: { type: string }
        suggested_action: { type: string }
        auto_fixable: { type: boolean }
    
    explainDelta:
      type: object
      required: [top_drivers, summary]
      properties:
        top_drivers:
          type: array
          items:
            type: object
            required: [node_id, node_label, contribution, sign, explanation]
            properties:
              node_id: { type: string }
              node_label: { type: string }
              contribution: { type: number }
              sign: { type: string, enum: ['+', '-'] }
              explanation: { type: string }
        summary: { type: string }
    
    runRequest:
      type: object
      required: [graph]
      properties:
        graph: { $ref: '#/components/schemas/graph' }
        seed: { type: integer, default: 42, minimum: 0, maximum: 2147483647 }

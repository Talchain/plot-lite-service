openapi: 3.0.3
info:
  title: PLoT Engine API
  version: 1.0.0
  description: |
    PLoT Engine v1 - Deterministic, auditable probabilistic models with trust signals.
    
    **Trust Signals**: All /v1 responses include Model Card, Confidence badge, and Explain-Δ.
    
    **Demo Mode**: Add `?demo=1` or header `X-Demo: 1` for deterministic sample payloads.
    When present, demo mode short-circuits request validation and returns a canonical demo payload.
    
    **Feature Flags**:
    - FEATURE_STREAM=1 enables real SSE /stream route (test-only otherwise)
    - AUTH_ENABLED=1 requires Authorization: Bearer <token> on certain routes
    - ISL_ENABLE=1 enables ISL (Inference Service Layer) integration for enhanced causal validation and sensitivity analysis
    
    **Legacy Routes**: /draft-flows, /critique, /improve (v0) remain for backwards compatibility. All three require Authorization: Bearer <token> when AUTH_ENABLED=1.
  contact:
    name: PLoT Engine
    url: https://github.com/Talchain/plot-lite-service
    email: devnull@talchain.ai
servers:
  - url: http://127.0.0.1:4311
    description: Local development
  - url: https://api.olumi.ai
    description: Production (future)
tags:
  - name: v1
    description: v1 API group
  - name: v2
    description: v2 API group - Option comparison with explicit interventions
  - name: stream
    description: Streaming endpoints
  - name: health
    description: Health and status endpoints
  - name: meta
    description: Version and metadata endpoints
  - name: inference
    description: Inference endpoints
  - name: validation
    description: Validation and critique endpoints
  - name: ergonomics
    description: Drafting and UX endpoints
  - name: legacy
    description: Legacy endpoints for backwards compatibility
  - name: analysis
    description: Analysis endpoints (sensitivity, robustness)
  - name: batch
    description: Batch operation endpoints
  - name: optimisation
    description: Optimization and action planning endpoints
  - name: calibration
    description: Preference calibration endpoints
  - name: cee-proxy
    description: CEE proxy endpoints for AI-assisted suggestions
paths:
  /health:
    get:
      summary: Engine health
      description: Returns engine health and minimal status for legacy clients.
      operationId: healthLegacy
      tags: [health]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, p95_ms, test_routes_enabled, replay]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  p95_ms:
                    type: number
                  test_routes_enabled:
                    type: boolean
                  replay:
                    type: object
  /version:
    get:
      summary: Engine version and capabilities
      description: |
        Returns engine version, build metadata, feature flags, and supported capabilities.
        UI clients should use the `capabilities` field to negotiate features.
      operationId: versionLegacy
      tags: [meta]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [api, build, model, version, flags, capabilities]
                properties:
                  api:
                    type: string
                    example: 'warp/0.1.0'
                  build:
                    type: string
                    description: 'Short git SHA or build identifier'
                  model:
                    type: string
                    example: 'plot-lite-abc1234'
                  version:
                    type: string
                    description: 'Package version for explicit tracking'
                    example: '1.5.0'
                  flags:
                    type: object
                    description: 'Feature flag states (ON/OFF)'
                    properties:
                      SCM_LITE_ENABLE: { type: string, enum: ['ON', 'OFF'] }
                      IDENT_TAG_ENABLE: { type: string, enum: ['ON', 'OFF'] }
                      PROVENANCE_ENABLE: { type: string, enum: ['ON', 'OFF'] }
                      ADAPTIVE_K_ENABLE: { type: string, enum: ['ON', 'OFF'] }
                      CONFIDENCE_CALIBRATED: { type: string, enum: ['ON', 'OFF'] }
                      PROMETHEUS_ENABLE: { type: string, enum: ['ON', 'OFF'] }
                      OPS_SNAPSHOT_ENABLE: { type: string, enum: ['ON', 'OFF'] }
                      RL_CB_ENABLE: { type: string, enum: ['ON', 'OFF'] }
                      SSE_MAX_MS: { type: string }
                      AUTH_ENABLED: { type: string, enum: ['ON', 'OFF'] }
                      ISL_ENABLE: { type: string, enum: ['ON', 'OFF'] }
                  capabilities:
                    type: object
                    description: 'Supported features for client capability negotiation'
                    required: [detail_level, inference_mode, streaming, isl_integration, max_recommended_latency_ms]
                    properties:
                      detail_level:
                        type: array
                        description: 'Supported detail levels for /v1/run'
                        items: { type: string, enum: ['quick', 'standard', 'deep'] }
                        example: ['quick', 'standard', 'deep']
                      inference_mode:
                        type: array
                        description: 'Supported inference modes'
                        items: { type: string, enum: ['model_based', 'model_of_inference'] }
                        example: ['model_based', 'model_of_inference']
                      streaming:
                        type: string
                        description: 'Streaming support level'
                        enum: ['legacy', 'enhanced']
                      isl_integration:
                        type: boolean
                        description: 'Whether ISL integration is enabled'
                      max_recommended_latency_ms:
                        type: integer
                        description: 'Hint for clients about expected latency (helps with proxy timeout config)'
                        example: 25000
                      weight_schema:
                        type: object
                        description: 'Weight schema versioning (Phase 2, Task 2.1)'
                        properties:
                          default_version:
                            type: string
                            enum: [v1, v2, v3]
                            description: 'Default weight schema version'
                          supported_versions:
                            type: array
                            items: { type: string, enum: [v1, v2, v3] }
                            description: 'Supported weight schema versions'
                          schemas:
                            type: object
                            description: 'Schema definitions by version'
                            additionalProperties:
                              type: object
                              properties:
                                version: { type: string }
                                min_bound: { type: number, nullable: true }
                                max_bound: { type: number, nullable: true }
                                description: { type: string }
                                ui_default: { type: boolean }
                      belief_spread:
                        type: object
                        description: 'Belief→spread mapping documentation (Phase 2, Task 2.2)'
                        properties:
                          current_version:
                            type: string
                            enum: [v1, v2]
                            description: 'Current formula version'
                          formula:
                            type: object
                            description: 'Formula specification'
                            properties:
                              version: { type: string }
                              description: { type: string }
                              formula: { type: string }
                              default_belief: { type: number }
                              parameters: { type: object }
                              effective_from: { type: string }
                              deprecated_from: { type: string, nullable: true }
                          visualisation_data:
                            type: array
                            description: 'Data points for UI visualisation of belief→spread curve'
                            items:
                              type: object
                              properties:
                                belief: { type: number, description: 'Belief level [0, 1]' }
                                spread: { type: number, description: 'Expected spread' }
                                spread_p10: { type: number }
                                spread_p90: { type: number }
                                inclusion_probability: { type: number }
                                variance_contribution: { type: number }
                          supported_versions:
                            type: array
                            items: { type: string, enum: [v1, v2] }
  /draft-flows:
    get:
      summary: Deterministic report for a template+seed
      operationId: draftFlowsGet
      tags: [legacy]
      description: |
        Returns a deterministic report.v1 fixture by template and seed.
        Authentication may be required when AUTH_ENABLED=1.
      parameters:
        - name: template
          in: query
          required: true
          schema:
            type: string
            enum: [pricing_change, feature_launch, build_vs_buy]
        - name: seed
          in: query
          required: true
          schema:
            type: integer
        - name: budget
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { schema: { type: string } }
            ETag: { schema: { type: string } }
            Vary: { schema: { type: string } }
            Content-Length: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reportV1'
        '304':
          description: Not Modified
        '400':
          description: Bad input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                unauthorized:
                  value:
                    schema: error.v1
                    code: UNAUTHORIZED
                    message: Missing bearer token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                forbidden:
                  value:
                    schema: error.v1
                    code: FORBIDDEN
                    message: Invalid token
    head:
      summary: Capability probe (method not allowed)
      operationId: runHeadV1
      tags: [v1, inference]
      description: Returns 405 Method Not Allowed. Use POST for inference requests.
      responses:
        '204':
          description: No Content - HEAD successful
        '405':
          description: Method Not Allowed - Use POST for this endpoint
          headers:
            Allow:
              schema: { type: string, example: 'POST, OPTIONS' }

  /v1/stream:
    get:
      summary: Stream first tokens
      operationId: streamV1
      tags: [v1, stream]
      description: |
        Streams the first tokens for a run. `?demo=1`  short-circuits validation and returns a canonical deterministic sample.
      parameters:
        - in: query
          name: demo
          schema: { type: integer, enum: [0,1], default: 0 }
          description: Enable deterministic demo stream (short-circuit before validation).
        - in: query
          name: latency_ms
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
          description: Optional sleep to simulate latency (ms).
      responses:
        "200":
          description: Server-Sent Events stream
          headers:
            Content-Type:
              description: SSE content type with charset
              schema: { type: string, example: 'text/event-stream; charset=utf-8' }
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/sseEvent"
          x-examples:
            sse:
              description: Example first frames
              value: |
                event: hello
                data: {"schema":"hello.v1","trace_id":"11111111-2222-4333-8444-555555555555"}

                event: token
                data: {"t":"hello"}
        "400":
          description: Bad input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorV1"
        "401":
          description: Unauthorized (missing/expired token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorV1"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorV1"
        "429":
          description: Too many concurrent streams
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema: { type: integer, minimum: 0 }
            X-RateLimit-Reason:
              description: Reason for rate limit decision
              schema: { type: string, enum: [per_ip, global] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorV1"
              examples:
                rate_limited:
                  value:
                    schema: error.v1
                    code: RATE_LIMITED
                    message: Too many streams
                    retry_after_s: 120
  /v1/health:
    get:
      summary: v1 Health endpoint
      operationId: healthV1
      description: |
        Returns engine health and minimal status for v1 clients.
      tags: [v1, health]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  api_version: { type: string }
                  p95_ms: { type: number }
                  version: { type: string, description: 'API version string (optional)' }
                  uptime_s: { type: number, description: 'Process uptime in seconds (optional)' }
                  last_request_at: { type: string, description: 'ISO timestamp of last observed request (optional)' }
                  environment: { type: string, description: 'Optional environment name (e.g., staging, prod)' }
                  build: { type: string, description: 'Optional short build identifier' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                unauthorized:
                  value:
                    schema: error.v1
                    code: UNAUTHORIZED
                    message: Missing bearer token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                forbidden:
                  value:
                    schema: error.v1
                    code: FORBIDDEN
                    message: Invalid token
  
  /v1/version:
    get:
      summary: v1 Version and features
      operationId: versionV1
      description: |
        Returns engine version, build metadata, and feature flags for v1 clients.
      tags: [v1, meta]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [api, version, build, model, features]
                properties:
                  api: { type: string, example: 'plot-engine/v1' }
                  version: { type: string, example: '1.0.0' }
                  build: { type: string }
                  model: { type: string }
                  features:
                    type: object
                    properties:
                      trust_signals: { type: boolean }
                      model_card: { type: string }
                      confidence_badge: { type: boolean }
                      explain_delta: { type: boolean }
                      cost_governance: { type: boolean }
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                internal_error:
                  value:
                    schema: error.v1
                    code: INTERNAL
                    message: Failed to retrieve version information
  
  /v1/openapi.json:
    get:
      summary: OpenAPI specification (read-only)
      operationId: openapiServeV1
      tags: [v1, meta]
      description: Serves the OpenAPI specification as JSON. Supports conditional requests via ETag.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { schema: { type: string, example: 'public, max-age=300' } }
            ETag: { schema: { type: string } }
            Vary: { schema: { type: string, example: 'If-None-Match' } }
          content:
            application/json:
              schema:
                type: object
              example:
                openapi: '3.0.3'
                info: { title: 'PLoT Engine API', version: '1.0.0' }
        '304':
          description: Not Modified
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                unauthorized:
                  value:
                    schema: error.v1
                    code: UNAUTHORIZED
                    message: Missing bearer token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                forbidden:
                  value:
                    schema: error.v1
                    code: FORBIDDEN
                    message: Invalid token
  
  /v1/run:
    head:
      summary: Probe endpoint availability
      operationId: headRunV1
      tags: [v1, meta]
      description: |
        Returns 405 Method Not Allowed with Allow header. Use POST for inference.
      responses:
        '204':
          description: No Content - HEAD successful
        '405':
          description: Method Not Allowed - Use POST for inference
          headers:
            Allow:
              schema: { type: string, example: 'POST, OPTIONS' }
    post:
      summary: Execute probabilistic model
      operationId: runV1
      tags: [v1, inference]
      description: |
        Run inference on a causal graph with full trust signals.
        Demo mode: `?demo=1` short-circuits validation and returns a canonical deterministic sample.
      parameters:
        - name: demo
          in: query
          required: false
          schema: { type: integer, enum: [0, 1] }
        - name: X-Demo
          in: header
          required: false
          schema: { type: string, enum: ['0', '1'] }
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional key to replay the exact prior response within a TTL (scoped per principal)
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/runRequest'
            examples:
              canonical_targets:
                summary: Canonical targets field
                value:
                  graph:
                    nodes:
                      - id: "A"
                        label: "Driver"
                        belief: 0.6
                      - id: "B"
                        label: "Outcome"
                    edges:
                      - id: "e1"
                        from: "A"
                        to: "B"
                        weight: 0.7
                        rationale: "A pushes B"
                  targets: ["B"]
                  seed: 4242
              legacy_query_targets:
                summary: Legacy query.targets (deprecated)
                value:
                  graph:
                    nodes:
                      - id: "A"
                        label: "Driver"
                        belief: 0.6
                      - id: "B"
                        label: "Outcome"
                    edges:
                      - id: "e1"
                        from: "A"
                        to: "B"
                        weight: 0.7
                        rationale: "A pushes B"
                  query:
                    targets: ["B"]
                  seed: 4242
      responses:
        '200':
          description: OK
          headers:
            Idempotent-Replayed:
              description: '1 if response is a replay from cache; 0 if computed fresh (when Idempotency-Key provided)'
              schema: { type: string, enum: ['0','1'] }
            X-RateLimit-Limit:
              description: Maximum requests per minute
              schema: { type: string }
            X-RateLimit-Remaining:
              description: Remaining requests in current window
              schema: { type: string }
            X-RateLimit-Reset:
              description: Unix timestamp when rate limit resets
              schema: { type: string }
            X-SCM-Lite:
              description: SCM-Lite enablement flag (0 or 1)
              schema: { type: string, enum: ['0','1'] }
            X-Olumi-Backend:
              description: Active backend mode (fallback or scm_lite)
              schema: { type: string, enum: ['fallback','scm_lite'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runResponse'
              examples:
                success:
                  value:
                    schema: run.v1
                    request_id: "req-123"
                    result:
                      response_hash: "a1b2c3d4e5f6..."
                      summary:
                        p10: 0.15
                        p50: 0.42
                        p90: 0.78
                      confidence: 0.85
                    meta:
                      seed: 4242
                      k_samples: 256
                success_with_cee:
                  summary: Response with CEE Decision Review (when CEE enabled)
                  value:
                    schema: run.v1
                    request_id: "req-123"
                    result:
                      response_hash: "a1b2c3d4e5f6..."
                      summary:
                        p10: 0.15
                        p50: 0.42
                        p90: 0.78
                    ceeReview:
                      schema: cee.decision-review.v1
                      response_hash: "a1b2c3d4e5f6..."
                      seed: 4242
                      inference_mode: fallback
                      graph_summary:
                        nodes: 5
                        edges: 8
                    ceeTrace:
                      requestId: "req-abc123"
                      degraded: false
                      timestamp: "2025-01-15T10:30:00Z"
                      featureVersion: "v1.0"
                cee_degraded:
                  summary: Response when CEE service unavailable (graceful degradation)
                  value:
                    schema: run.v1
                    request_id: "req-123"
                    result:
                      response_hash: "a1b2c3d4e5f6..."
                      summary:
                        p10: 0.15
                        p50: 0.42
                        p90: 0.78
                    ceeTrace:
                      requestId: "req-xyz789"
                      degraded: true
                      timestamp: "2025-01-15T10:30:00Z"
                    ceeError:
                      code: "CEE_SERVICE_UNAVAILABLE"
                      message: "CEE service is temporarily unavailable"
                      retryable: true
                      suggestedAction: "retry"
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                too_large:
                  value:
                    schema: error.v1
                    code: BAD_INPUT
                    message: Request entity too large
        '429':
          description: Too many requests (per-minute limit)
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema: { type: integer, minimum: 0 }
            X-RateLimit-Reset:
              description: Unix epoch seconds when the window resets
              schema: { type: string }
            X-RateLimit-Reason:
              description: Reason for rate limit decision
              schema: { type: string, enum: [per_ip] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                rate_limited:
                  value:
                    schema: error.v1
                    code: RATE_LIMITED
                    message: Too many requests
        '400':
          description: Bad input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                bad_input:
                  value:
                    schema: error.v1
                    code: BAD_INPUT
                    message: 'Missing required field: graph'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                unauthorized:
                  value:
                    schema: error.v1
                    code: UNAUTHORIZED
                    message: Missing bearer token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                forbidden:
                  value:
                    schema: error.v1
                    code: FORBIDDEN
                    message: Invalid token
  
  /v1/limits:
    get:
      summary: Get graph size limits
      operationId: limitsV1
      tags: [v1, meta]
      description: |
        Returns the configured maximum graph size limits.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [schema, max_nodes, max_edges, max_body_kb]
                properties:
                  schema:
                    type: string
                    enum: [limits.v1]
                  max_nodes:
                    type: integer
                    example: 50
                  max_edges:
                    type: integer
                    example: 100
                  max_body_kb:
                    type: integer
                    example: 96
                    description: Maximum request body size in kilobytes
                  run_critique_node_limit:
                    type: integer
                    example: 40
                    description: >-
                      Run-path critique threshold. Graphs with more nodes still
                      compute, but a BLOCKER critique marks results approximate.
                  run_edge_soft_limit:
                    type: integer
                    example: 120
                    description: >-
                      Advisory edge threshold. Graphs with more edges receive a
                      non-blocking critique; results are unaffected.
                  run_edge_hard_limit:
                    type: integer
                    example: 160
                    description: >-
                      Hard edge critique threshold. Graphs with more edges still
                      compute, but a BLOCKER critique marks results approximate.
              examples:
                success:
                  value:
                    schema: limits.v1
                    max_nodes: 50
                    max_edges: 100
                    max_body_kb: 96
                    run_critique_node_limit: 40
                    run_edge_soft_limit: 120
                    run_edge_hard_limit: 160
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                internal_error:
                  value:
                    schema: error.v1
                    code: INTERNAL
                    message: Failed to retrieve limits
  
  /v1/validate:
    post:
      summary: Validate /v1/run payload
      operationId: validateV1
      tags: [v1, validation]
      description: |
        Validates a /v1/run request payload without execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/runRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                required: [valid, violations]
                properties:
                  valid:
                    type: boolean
                  violations:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        reason:
                          type: string
                        code:
                          type: string
                          description: 'Violation code (e.g., MISSING_BELIEF_ON_OUTCOME_EDGE)'
                        severity:
                          type: string
                          enum: [warning, error]
                          description: 'Severity level (warning = non-fatal)'
                        at:
                          type: object
                          description: 'Location of violation (e.g., edge from/to)'
                        suggestion:
                          type: string
                          description: 'Coaching text for UI display'
              examples:
                valid_with_warnings:
                  value:
                    valid: true
                    violations:
                      - code: MISSING_BELIEF_ON_OUTCOME_EDGE
                        severity: warning
                        at:
                          from: Price
                          to: Revenue
                        suggestion: Add belief 0..1 to edges into outcomes to calibrate uncertainty.
        '400':
          description: Bad input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorV1'
              examples:
                bad_input:
                  value:
                    schema: error.v1
                    code: BAD_INPUT
                    message: Graph validation failed
  
  /v1/validate-patch:
    post:
      summary: Apply and validate graph patch operations
      operationId: validatePatch
      tags: [v1, validation]
      description: |
        Applies sequential patch operations to a graph and validates the result.
        Returns the patched graph, its canonical normalised form, a graph hash, and any repairs applied.

        **Feature flag**: When `ENABLE_VALIDATE_PATCH=0`, returns HTTP 501 with `FEATURE_DISABLED` envelope.
        Callers should detect this via the response code, not by parsing the message string.
        Response will not include graph, graph_hash, repairs_applied, or warnings fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph, operations]
              properties:
                graph:
                  type: object
                  required: [nodes, edges]
                  properties:
                    nodes:
                      type: array
                      items: {}
                    edges:
                      type: array
                      items: {}
                operations:
                  type: array
                  description: Ordered list of patch operations to apply
                  items:
                    type: object
                    required: [op, path]
                    properties:
                      op:
                        type: string
                        enum: [add_node, add_edge, remove_node, remove_edge, update_node, update_edge]
                      path:
                        type: string
                        description: Entity ID (node ID or edge key "from->to")
                      value:
                        type: object
                        description: Value to add or merge (for add/update operations)
                      previous:
                        type: object
                        description: Previous value for undo support
                request_id:
                  type: string
      responses:
        '200':
          description: Patch applied successfully
          content:
            application/json:
              schema:
                type: object
                required: [status, graph, normalised_graph, graph_hash, repairs_applied, warnings]
                properties:
                  status:
                    type: string
                    enum: [applied]
                  graph:
                    type: object
                    description: Input graph after patch operations (pre-normalisation)
                  normalised_graph:
                    type: object
                    description: Canonical form the UI should adopt after patch acceptance
                  graph_hash:
                    type: string
                    description: 16-char hex hash of the normalised graph
                  repairs_applied:
                    type: array
                    items:
                      type: object
                  warnings:
                    type: array
                    items:
                      type: object
        '400':
          description: Invalid request or patch rejected (validation failure)
          content:
            application/json:
              schema:
                type: object
                required: [status, code, message]
                properties:
                  status:
                    type: string
                    enum: [rejected]
                  code:
                    type: string
                  message:
                    type: string
                  violations:
                    type: array
                    items:
                      type: object
              examples:
                patch_rejected:
                  value:
                    status: rejected
                    code: PATCH_FAILED
                    message: add_node failed — node already exists
                bad_input:
                  value:
                    schema: error.v1
                    status: rejected
                    code: BAD_INPUT
                    message: Request body is missing or not JSON
        '501':
          description: Feature disabled (ENABLE_VALIDATE_PATCH=0)
          content:
            application/json:
              schema:
                type: object
                required: [status, code, message]
                properties:
                  status:
                    type: string
                    enum: [rejected]
                  code:
                    type: string
                    enum: [FEATURE_DISABLED]
                  message:
                    type: string
              examples:
                feature_disabled:
                  value:
                    status: rejected
                    code: FEATURE_DISABLED
                    message: validate-patch is not enabled

